  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/light/style.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/thin/style.css" rel="stylesheet">

  <script src="shell.js"></script>

<body>
<div class="phone has-wall">

  <header class="c-statusbar">
    <span>9:41</span>
    <span class="c-statusbar__icons">
      <span class="material-symbols-outlined">signal_cellular_alt</span>
      <span class="material-symbols-outlined">wifi</span>
      <span class="material-symbols-outlined">battery_full</span>
    </span>
  </header>

  <div class="c-xbar" aria-hidden="true"><span class="c-xbar__title">Saved</span></div>

  <main class="screen-scroll">

    <header class="c-hero">
    <div class="c-largetitle">
      <h1 class="c-largetitle__title">Saved</h1>
    </div>
    </header>

    <div class="c-surface">

    <div class="c-empty">
      <span class="c-empty__icon"><span class="material-symbols-outlined">bookmark</span></span>
      <h2 class="c-empty__title">No saved places yet</h2>
      <p class="c-empty__sub">Tap the bookmark on any partner to keep it here for later.</p>
    </div>

    <div class="u-gutter u-mt-32">
      <a class="c-btn primary" href="explore.html">Explore places</a>
    </div>

    </div>
  </main>

  <nav class="c-tabbar c-tabbar--flat" aria-label="Sections">
    <a class="c-tabbar__tab" href="map.html"><i class="ph-thin ph-map-trifold c-tabbar__icon" aria-hidden="true"></i>Map</a>
    <a class="c-tabbar__tab" href="explore.html"><i class="ph-thin ph-compass c-tabbar__icon" aria-hidden="true"></i>Discover</a>
    <a class="c-tabbar__tab" href="card.html"><i class="ph-thin ph-credit-card c-tabbar__icon" aria-hidden="true"></i>Card</a>
    <a class="c-tabbar__tab" href="concierge.html"><i class="ph-thin ph-chat-circle c-tabbar__icon" aria-hidden="true"></i>Concierge</a>
    <a class="c-tabbar__tab is-active" href="me.html" aria-current="page"><i class="ph-thin ph-user-circle c-tabbar__icon" aria-hidden="true"></i>Me</a>
  </nav>
  <span class="c-homeindicator"></span>

</div>
