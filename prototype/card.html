  <meta charset="utf-8">

  <link href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/light/style.css" rel="stylesheet">

<body>
<div class="phone c-cardtab c-cardwhite c-cardbig c-cfc">

  <header class="c-statusbar">
    <span>9:41</span>
    <span class="c-statusbar__icons">
      <span class="material-symbols-outlined">signal_cellular_alt</span>
      <span class="material-symbols-outlined">wifi</span>
      <span class="material-symbols-outlined">battery_full</span>
    </span>
  </header>


  <main class="screen-scroll">

    <header class="c-hero">
      <section class="u-gutter c-cardstage">
      <div class="c-mcard is-prestige is-portrait" data-mcard role="button" tabindex="0" aria-pressed="false" aria-label="Membership card. Tap to show the QR code.">
        <div class="c-mcard__flipper">
          <div class="c-mcard__face c-mcard__front">
            <span class="c-mcard__sheen" aria-hidden="true"></span>
            <span class="c-mcard__ghost" aria-hidden="true"><span>Su</span><span>bic</span></span>
            <img class="c-mcard__logo" src="img/logo.svg" alt="Subic.Life">
            <span class="c-mcard__foot">Prestige member</span>
          </div>
          <div class="c-mcard__face c-mcard__back" aria-hidden="true">
            <span class="c-mcard__sheen"></span>
            <div class="c-mcard__qrtile"><span class="c-qr is-card"></span></div>
            <p class="c-mcard__number">SL 0042 1187</p>
            <p class="c-mcard__valid">Valid until Mar 2027</p>
          </div>
        </div>
      </div>
      </section>
      <a class="c-cfc__main" href="card-staff.html"><i class="ph-light ph-qr-code" aria-hidden="true"></i>Show QR to staff</a>
      <nav class="c-cfc__links" aria-label="Card">
        <a href="card-benefits.html">Perks</a><a href="card-savings.html">Savings</a><a href="emergency.html">Emergency help</a>
      </nav>
    </header>

  </main>
  <nav class="c-tabbar c-tabbar--flat" aria-label="Sections">
    <a class="c-tabbar__tab" href="map.html"><i class="ph-thin ph-map-trifold c-tabbar__icon" aria-hidden="true"></i>Map</a>
    <a class="c-tabbar__tab" href="explore.html"><i class="ph-thin ph-compass c-tabbar__icon" aria-hidden="true"></i>Discover</a>
    <a class="c-tabbar__tab is-active" href="card.html" aria-current="page"><i class="ph-thin ph-credit-card c-tabbar__icon" aria-hidden="true"></i>Card</a>
    <a class="c-tabbar__tab" href="concierge.html"><i class="ph-thin ph-chat-circle c-tabbar__icon" aria-hidden="true"></i>Concierge</a>
    <a class="c-tabbar__tab" href="me.html"><i class="ph-thin ph-user-circle c-tabbar__icon" aria-hidden="true"></i>Me</a>
  </nav>
  <span class="c-homeindicator"></span>

</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="app.js"></script>
<script src="img/real/manifest.js"></script>
<script src="real-photos.js"></script>
</body>
</html>
