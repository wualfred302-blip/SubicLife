<div class="phone c-discover c-auth c-auth--white c-auth--social">

  <header class="c-statusbar">
    <span>9:41</span>
    <span class="c-statusbar__icons">
      <span class="material-symbols-outlined">signal_cellular_alt</span>
      <span class="material-symbols-outlined">wifi</span>
      <span class="material-symbols-outlined">battery_full</span>
    </span>
  </header>

  <div class="c-dhead c-dhead--push">
    <a class="c-dhead__back" data-back href="welcome.html" aria-label="Back to welcome"><i class="ph-light ph-caret-left" aria-hidden="true"></i></a>
    <img class="c-auth__inklogo" src="img/logo-ink.svg" alt="Subic.Life">
    <span class="c-dhead__spacer" aria-hidden="true"></span>
  </div>

  <div class="c-auth__head">
    <h1 class="c-auth__title">Join Subic.Life</h1>
    <p class="c-auth__sub">Pick how you'd like to sign up.</p>
  </div>

  <section class="c-auth__sheet">

    <p class="c-auth__or"><span>or</span></p>
    <div class="c-auth__cta">
      <a class="c-auth__send" href="signup.html">Continue with mobile number</a>
      <a class="c-auth__alt" href="signin.html">I have an account</a>

  <span class="c-homeindicator"></span>
