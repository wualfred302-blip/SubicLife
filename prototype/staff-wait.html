<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Subic.Life Partner - Waiting</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="components.css">
  <link rel="stylesheet" href="components-b.css">
  <link rel="stylesheet" href="screen.css">
  <link rel="stylesheet" href="shell.css">
  <link rel="stylesheet" href="theme.css">
  <script src="shell.js"></script>
</head>
<body>
<div class="phone c-phone--push">

  <header class="c-statusbar">
    <span>9:41</span>
    <span class="c-statusbar__icons">
      <span class="material-symbols-outlined">signal_cellular_alt</span>
      <span class="material-symbols-outlined">wifi</span>
      <span class="material-symbols-outlined">battery_full</span>
    </span>
  </header>

  <nav class="c-navbar c-navbar--wide">
    <a data-back class="c-navbar__back is-text" id="cancel" href="staff-bill.html">Cancel</a>
    <h1 class="c-navbar__title">Subic.Life Partner</h1>
    <span></span>
  </nav>

  <main class="u-fill-col c-wait">
    <div class="c-spinner" role="img" aria-label="Waiting for the member to approve"></div>
    <h2 class="c-wait__title">Waiting for Ana to approve…</h2>
    <p class="c-wait__sub">Meat Plus Cafe · Table 7</p>
    <div class="c-hero-amount">
      <p class="c-hero-amount__value" id="amt">₱1,920</p>
      <p class="c-hero-amount__caption">Sent to Ana's phone</p>
    </div>
  </main>

  <span class="c-homeindicator"></span>

</div>
<script>
  // Auto-advances to the paid screen after 2s. ?still freezes the wait for screenshots.
  (function () {
    var params = new URLSearchParams(location.search);
    var pay = parseInt(params.get('pay'), 10) || 1920;
    var bill = params.get('bill') || '2400';
    document.getElementById('amt').textContent = '₱' + pay.toLocaleString('en-US');
    document.getElementById('cancel').href = 'staff-bill.html?bill=' + bill;
    if (!params.has('still')) {
      setTimeout(function () { subicNav('staff-paid.html?pay=' + pay, 'push'); }, 2000);
    }
  })();
</script>
</body>
</html>
