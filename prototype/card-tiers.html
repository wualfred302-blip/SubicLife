<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Subic.Life - Membership tiers</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="components.css">
  <link rel="stylesheet" href="components-a.css">
  <link rel="stylesheet" href="components-b.css">
  <style>
    /* Light investor page: no phone frame, no tab bar. */
    body {
      margin: 0;
      padding: var(--space-8) var(--gutter);
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
    }
    .tiers-page { width: min(var(--size-mcard-w), 100%); margin: 0 auto; }
    .tiers-page h1 {
      margin: 0 0 var(--space-6);
      font: var(--fw-bold) var(--fs-section)/var(--lh-tight) var(--font);
      letter-spacing: var(--track-tight);
    }
    .tiers { display: flex; flex-direction: column; gap: var(--space-8); }
    .tiers__item { margin: 0; }
    .tiers__caption { margin: var(--space-3) 0 0; }
    .tiers__name {
      margin: 0;
      font: var(--fw-semibold) var(--fs-body)/var(--lh-tight) var(--font);
      letter-spacing: var(--track-tight);
    }
    .tiers__price {
      margin: var(--space-half) 0 0;
      font: var(--fw-regular) var(--fs-footnote)/var(--lh-snug) var(--font);
      color: var(--text-2);
      font-variant-numeric: tabular-nums;
    }
    /* Shell-only pieces: status bar, nav bar and the Upgrade bar. Hidden on the investor page. */
    html:not(.is-embedded) .shell-only { display: none !important; }
    html.is-embedded body.tiers-body { display: flex; flex-direction: column; height: 100%; }
    html.is-embedded .tiers-page {
      flex: 1 1 auto;
      min-height: 0;
      width: 100%;
      margin: 0;
      padding: var(--space-4) var(--gutter) var(--space-6);
      box-sizing: border-box;
      overflow-y: auto;
      scrollbar-width: none;
    }
    html.is-embedded .tiers-page::-webkit-scrollbar { display: none; }
    html.is-embedded .tiers-page h1 { display: none; }
    html.is-embedded .tiers { gap: var(--space-6); }
    html.is-embedded .c-bottombar.shell-only { position: relative; flex: none; }
  </style>
  <link rel="stylesheet" href="shell.css">
  <link rel="stylesheet" href="theme.css">
  <script src="shell.js"></script>
</head>
<body class="tiers-body">
<header class="c-statusbar shell-only">
  <span>9:41</span>
  <span class="c-statusbar__icons">
    <span class="material-symbols-outlined">signal_cellular_alt</span>
    <span class="material-symbols-outlined">wifi</span>
    <span class="material-symbols-outlined">battery_full</span>
  </span>
</header>
<nav class="c-navbar shell-only">
  <a data-back class="c-navbar__back" href="me.html" aria-label="Back to Me">
    <svg class="c-navbar__chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="M15.75 19.5L8.25 12l7.5-7.5"/></svg>
  </a>
  <p class="c-navbar__title">Membership</p>
  <span></span>
</nav>
<main class="tiers-page">
  <h1>Membership tiers</h1>
  <div class="tiers">

    <figure class="tiers__item">
      <div class="c-mcard is-premium" data-mcard role="button" tabindex="0" aria-pressed="false" aria-label="Premium card. Tap to show the QR code.">
        <div class="c-mcard__flipper">
          <div class="c-mcard__face c-mcard__front">
            <span class="c-mcard__sheen" aria-hidden="true"></span>
            <div class="c-mcard__top">
              <img class="c-wordmark c-logo is-ink" src="img/logo.svg" alt="Subic.Life">
              <span class="c-mcard__tier">Premium</span>
            </div>
            <span class="material-symbols-outlined c-mcard__contactless" aria-hidden="true">contactless</span>
            <div class="c-mcard__bottom">
              <div>
                <p class="c-mcard__name">Ana Reyes</p>
                <p class="c-mcard__since">Member since 2025</p>
              </div>
              <p class="c-mcard__number">0042 1187</p>
            </div>
          </div>
          <div class="c-mcard__face c-mcard__back" aria-hidden="true">
            <span class="c-mcard__sheen"></span>
            <div class="c-mcard__qrtile"><span class="c-qr is-card"></span></div>
            <p class="c-mcard__number">0042 1187</p>
          </div>
        </div>
      </div>
      <figcaption class="tiers__caption">
        <p class="tiers__name">Premium</p>
        <p class="tiers__price">₱5,000 a year</p>
      </figcaption>
    </figure>

    <figure class="tiers__item">
      <div class="c-mcard is-prestige" data-mcard role="button" tabindex="0" aria-pressed="false" aria-label="Prestige card. Tap to show the QR code.">
        <div class="c-mcard__flipper">
          <div class="c-mcard__face c-mcard__front">
            <span class="c-mcard__sheen" aria-hidden="true"></span>
            <div class="c-mcard__top">
              <img class="c-wordmark c-logo" src="img/logo.svg" alt="Subic.Life">
              <span class="c-mcard__tier">Prestige</span>
            </div>
            <span class="material-symbols-outlined c-mcard__contactless" aria-hidden="true">contactless</span>
            <div class="c-mcard__bottom">
              <div>
                <p class="c-mcard__name">Ana Reyes</p>
                <p class="c-mcard__since">Member since 2025</p>
              </div>
              <p class="c-mcard__number">0042 1187</p>
            </div>
          </div>
          <div class="c-mcard__face c-mcard__back" aria-hidden="true">
            <span class="c-mcard__sheen"></span>
            <div class="c-mcard__qrtile"><span class="c-qr is-card"></span></div>
            <p class="c-mcard__number">0042 1187</p>
          </div>
        </div>
      </div>
      <figcaption class="tiers__caption">
        <p class="tiers__name">Prestige</p>
        <p class="tiers__price">₱12,000 a year</p>
      </figcaption>
    </figure>

    <figure class="tiers__item">
      <div class="c-mcard is-elite" data-mcard role="button" tabindex="0" aria-pressed="false" aria-label="Elite card. Tap to show the QR code.">
        <div class="c-mcard__flipper">
          <div class="c-mcard__face c-mcard__front">
            <span class="c-mcard__sheen" aria-hidden="true"></span>
            <div class="c-mcard__top">
              <img class="c-wordmark c-logo" src="img/logo.svg" alt="Subic.Life">
              <span class="c-mcard__tier">Elite</span>
            </div>
            <span class="material-symbols-outlined c-mcard__contactless" aria-hidden="true">contactless</span>
            <div class="c-mcard__bottom">
              <div>
                <p class="c-mcard__name">Ana Reyes</p>
                <p class="c-mcard__since">Member since 2025</p>
              </div>
              <p class="c-mcard__number">0042 1187</p>
            </div>
          </div>
          <div class="c-mcard__face c-mcard__back" aria-hidden="true">
            <span class="c-mcard__sheen"></span>
            <div class="c-mcard__qrtile"><span class="c-qr is-card"></span></div>
            <p class="c-mcard__number">0042 1187</p>
          </div>
        </div>
      </div>
      <figcaption class="tiers__caption">
        <p class="tiers__name">Elite</p>
        <p class="tiers__price">₱25,000 a year</p>
      </figcaption>
    </figure>

  </div>
</main>
<div class="c-bottombar c-bottombar--full shell-only">
  <a class="c-btn primary" href="choose-tier.html">Upgrade to Elite · ₱25,000/yr</a>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="app.js"></script>
</body>
</html>
