<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFFFFF">
  <title>Subic.Life - Feed</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="components.css">
  <link rel="stylesheet" href="screen.css">
  <link rel="stylesheet" href="components-a.css">
  <link rel="stylesheet" href="components-e.css">
  <link rel="stylesheet" href="shell.css">
  <link rel="stylesheet" href="theme.css">
  <script src="shell.js"></script>
</head>
<div class="phone theme-night c-explore c-feedpage">

  <header class="c-statusbar">
    <span>9:41</span>
    <span class="c-statusbar__icons">
      <span class="material-symbols-outlined">signal_cellular_alt</span>
      <span class="material-symbols-outlined">wifi</span>
      <span class="material-symbols-outlined">battery_full</span>
    </span>
  </header>

  <div class="c-fbhead">
    <div class="c-fbhead__top"><span class="c-fbhead__word"><img class="c-fbhead__logo" src="img/logo.svg" alt="Subic.Life"></span><a class="c-fbhead__btn" href="me.html" aria-label="Menu"><span class="material-symbols-outlined">menu</span></a></div>
    <nav class="c-iconnav" aria-label="Sections"><a href="map.html" aria-label="Map"><span class="material-symbols-outlined">map</span></a><a href="feed.html" aria-label="Feed" aria-current="page"><span class="material-symbols-outlined">dynamic_feed</span></a><a href="explore.html" aria-label="Explore"><span class="material-symbols-outlined">explore</span></a><a href="card.html" aria-label="Card"><span class="material-symbols-outlined">credit_card</span></a><a href="concierge.html" aria-label="Concierge"><span class="material-symbols-outlined">headset_mic</span></a></nav>
  </div>

  <main class="screen-scroll">
    <header class="c-hero">
      <h1 class="u-sr-only">Feed</h1>
    </header>
    <div class="c-fgrid" id="feed-grid"></div>
  </main>

</div>
<script src="data-a.js"></script>
<script src="data-e.js"></script>
<script src="app.js"></script>
<script>
  function esc(t) { return String(t).replace(/[&<>"']/g, function (c) { return '&#' + c.charCodeAt(0) + ';'; }); }
  function post(s) {
    var face = s.avatar ? '<img src="' + s.avatar + '" alt="">' : '<span class="c-mono" style="background:' + window.monoColour(s.initials) + '">' + esc(s.initials) + '</span>';
    return '<a class="c-fpost" href="post.html?id=' + s.id + '">' +
      '<img class="c-fpost__img" src="' + s.photos[0] + '" alt="">' +
      '<span class="c-fpost__cap">' + esc(s.caption || PLACES[s.place].name) + '</span>' +
      '<span class="c-fpost__by"><span class="c-fpost__face">' + face + '</span><span class="c-fpost__name">' + esc(s.mine ? 'You' : s.author) + '</span>' +
      '<span class="c-fpost__likes"><span class="material-symbols-outlined">favorite</span>' + (s.likes || 0) + '</span></span></a>';
  }
  var cols = ['', ''];
  FEED.stories.forEach(function (s, i) { cols[i % 2] += post(s); });
  document.getElementById('feed-grid').innerHTML = '<div class="c-fgrid__col">' + cols[0] + '</div><div class="c-fgrid__col">' + cols[1] + '</div>';
</script>
</body>
</html>
