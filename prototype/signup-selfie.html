<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Subic.Life - Sign up</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="components.css">
  <link rel="stylesheet" href="components-c.css">
  <link rel="stylesheet" href="screen.css">
  <link rel="stylesheet" href="shell.css">
  <link rel="stylesheet" href="theme.css">
  <script src="shell.js"></script>
</head>
<body>
<div class="phone theme-night is-onboard c-push">

  <header class="c-statusbar">
    <span>9:41</span>
    <span class="c-statusbar__icons">
      <span class="material-symbols-outlined">signal_cellular_alt</span>
      <span class="material-symbols-outlined">wifi</span>
      <span class="material-symbols-outlined">battery_full</span>
    </span>
  </header>

  <nav class="c-navbar">
    <a data-back class="c-navbar__back" href="signup-details.html" aria-label="Back to name on your card">
      <svg class="c-navbar__chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="M15.75 19.5L8.25 12l7.5-7.5"/></svg>
    </a>
    <h1 class="c-navbar__title">Sign up</h1>
    <span></span>
  </nav>

  <main class="screen-scroll">

    <section class="u-gutter u-mt-8">
      <h2 class="c-section-title is-title">Photo for your card</h2>
      <p class="c-group__sub">Partner staff match it to you when you show your card.</p>
    </section>

    <section class="u-gutter u-mt-32">
      <div class="c-selfie" aria-hidden="true">
        <span class="material-symbols-outlined">person</span>
      </div>
    </section>

    <section class="u-gutter u-mt-32">
      <a class="c-btn primary" href="choose-tier.html">Take a selfie</a>
    </section>

  </main>

  <span class="c-homeindicator"></span>

</div>
<script src="app.js"></script>
<script src="img/real/manifest.js"></script>
<script src="real-photos.js"></script>
</body>
</html>
