<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFFFFF">
  <title>Subic.Life - Saved</title><link rel="icon" href="img/icon.svg" type="image/svg+xml"><link rel="icon" href="img/favicon-32.png" sizes="32x32"><link rel="apple-touch-icon" href="img/apple-touch-icon.png"><link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/light/style.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/thin/style.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css" rel="stylesheet">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="components.css">
  <link rel="stylesheet" href="screen.css">
  <link rel="stylesheet" href="components-a.css">
  <link rel="stylesheet" href="shell.css">
  <link rel="stylesheet" href="theme.css">
  <script src="shell.js"></script>
</head>
<body>
<div class="phone c-discover c-savedpage">

  <header class="c-statusbar">
    <span>9:41</span>
    <span class="c-statusbar__icons">
      <span class="material-symbols-outlined">signal_cellular_alt</span>
      <span class="material-symbols-outlined">wifi</span>
      <span class="material-symbols-outlined">battery_full</span>
    </span>
  </header>

  <div class="c-dhead c-dhead--push">
    <a class="c-dhead__back" href="me.html" data-back aria-label="Back to Me"><i class="ph-light ph-caret-left" aria-hidden="true"></i></a>
    <h1 class="c-dhead__title">Saved</h1>
    <span class="c-dhead__spacer" aria-hidden="true"></span>
  </div>

  <main class="screen-scroll">
    <div class="c-dtabbar"><div class="c-dtabs" role="tablist" aria-label="Saved type">
      <button class="c-dtabs__tab" type="button" role="tab" aria-selected="true" data-seg="place">Places<span class="c-dtabs__n" data-n="place"></span></button>
      <button class="c-dtabs__tab" type="button" role="tab" aria-selected="false" data-seg="offer">Offers<span class="c-dtabs__n" data-n="offer"></span></button>
    </div></div>
    <div class="c-svgrid" data-grid></div>
    <div class="c-svempty" data-empty hidden>
      <i class="ph-thin ph-heart" aria-hidden="true"></i>
      <p class="c-svempty__title" data-empty-title></p>
      <p class="c-svempty__text">Tap the heart on a place or an offer to keep it here.</p>
      <a class="c-svempty__link" href="explore.html">Go to Discover</a>
    </div>
  </main>

  <nav class="c-tabbar c-tabbar--flat" aria-label="Sections">
    <a class="c-tabbar__tab" href="map.html"><i class="ph-thin ph-map-trifold c-tabbar__icon" aria-hidden="true"></i>Map</a>
    <a class="c-tabbar__tab" href="explore.html"><i class="ph-thin ph-compass c-tabbar__icon" aria-hidden="true"></i>Discover</a>
    <a class="c-tabbar__tab" href="card.html"><i class="ph-thin ph-identification-card c-tabbar__icon" aria-hidden="true"></i>Card</a>
    <a class="c-tabbar__tab" href="concierge.html"><i class="ph-thin ph-chat-circle-dots c-tabbar__icon" aria-hidden="true"></i>Concierge</a>
    <a class="c-tabbar__tab is-active" href="me.html" aria-current="page"><i class="ph-thin ph-user c-tabbar__icon" aria-hidden="true"></i>Me</a>
  </nav>
  <span class="c-homeindicator"></span>

</div>
<script src="data-a.js"></script>
<script src="data-e.js"></script>
<script src="img/real/manifest.js"></script>
<script src="real-photos.js"></script>
<script src="saved.js"></script>
<script>
  // Saved: the places and offers Ana bookmarked anywhere in the app, as Discover's listing cards in two columns.
  // Tapping a card's bookmark removes it here and everywhere else.
  (function () {
    var grid = document.querySelector('[data-grid]');
    var empty = document.querySelector('[data-empty]');
    var chips = document.querySelectorAll('[data-seg]');
    var kind = 'place';

    function esc(s) {
      return String(s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }
    var ICON_STAR = '<svg class="c-cstar" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.6l1.95 3.95 4.35.63-3.15 3.07.74 4.33L8 11.53l-3.89 2.05.74-4.33L1.7 6.18l4.35-.63z" fill="#E8590C" stroke="#E8590C" stroke-width="1.3" stroke-linejoin="round"/><path d="M8 1.6l1.95 3.95L8 6.75z" fill="#F5A06A"/></svg>';
    function mark(k, id, name) {
      return '<button class="c-savebtn is-on" type="button" aria-pressed="true" aria-label="Remove ' + esc(name) + ' from Saved" data-kind="' + k + '" data-id="' + id + '">' +
        '<i class="ph-fill ph-heart c-savebtn__fill" aria-hidden="true"></i><i class="ph ph-heart c-savebtn__line" aria-hidden="true"></i></button>';
    }
    function placeCard(id) {
      var p = PLACES[id];
      if (!p) return '';
      // Same text as the Discover cards: name, type in grey, rating on the right. No price or distance (2026-11-09).
      var type = p.category.charAt(0) + p.category.slice(1).toLowerCase();
      return '<div class="c-lcard">' +
        '<a class="c-lcard__link" href="place.html?p=' + id + '">' +
        '<span class="c-lcard__photo"><img src="' + p.thumb + '" alt=""><span class="c-lcard__perk">' + esc(p.offerShort) + '</span></span>' +
        '<span class="c-ctext"><span class="c-ctext__title"><span class="c-lcard__name">' + esc(p.name) + '</span></span>' +
        '<span class="c-lcard__meta">' + esc(type) + '</span>' +
        '<span class="c-crating">' + ICON_STAR + '<span class="u-sr-only">Rated </span>' + esc(p.rating) + '</span></span>' +
        '</a>' + mark('place', id, p.name) + '</div>';
    }
    function offerCard(id) {
      var o = offerFor(id);
      if (!o) return '';
      var p = PLACES[o.place];
      return '<div class="c-lcard">' +
        '<a class="c-lcard__link" href="place.html?p=' + o.place + '">' +
        '<span class="c-lcard__photo"><img src="' + o.photo + '" alt=""><span class="c-lcard__perk">' + esc(o.title) + '</span></span>' +
        // Same layout as the place cards: the offer as the orange tag, then the place's name and how long it runs.
        '<span class="c-ctext"><span class="c-ctext__title"><span class="c-lcard__name">' + esc(p.name) + '</span></span>' +
        '<span class="c-lcard__meta">Until ' + esc(o.valid) + '</span></span>' +
        '</a>' + mark('offer', id, o.title) + '</div>';
    }

    function render() {
      ['place', 'offer'].forEach(function (k) {
        document.querySelector('[data-n="' + k + '"]').textContent = SLSaved.list(k).length;
      });
      var ids = SLSaved.list(kind);
      grid.innerHTML = ids.map(kind === 'place' ? placeCard : offerCard).join('');
      grid.hidden = !ids.length;
      empty.hidden = !!ids.length;
      document.querySelector('[data-empty-title]').textContent = kind === 'place' ? 'No saved places' : 'No saved offers';
    }

    chips.forEach(function (chip) {
      chip.addEventListener('click', function () {
        kind = chip.getAttribute('data-seg');
        chips.forEach(function (c) {
          var on = c === chip;
          c.setAttribute('aria-selected', on ? 'true' : 'false');
        });
        render();
      });
    });
    grid.addEventListener('click', function (e) {
      var b = e.target.closest('.c-savebtn');
      if (!b) return;
      SLSaved.toggle(b.getAttribute('data-kind'), b.getAttribute('data-id'));
      render();
      SLSaved.note(false);
    });
    render();
  })();
</script>
</body>
</html>
