<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Subic.Life - Show to Staff</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="components.css">
  <link rel="stylesheet" href="components-b.css">
  <link rel="stylesheet" href="screen.css">
  <link rel="stylesheet" href="shell.css">
  <link rel="stylesheet" href="theme.css">
  <script src="shell.js"></script>
</head>
<body>
<div class="phone">

  <header class="c-statusbar">
    <span>9:41</span>
    <span class="c-statusbar__icons">
      <span class="material-symbols-outlined">signal_cellular_alt</span>
      <span class="material-symbols-outlined">wifi</span>
      <span class="material-symbols-outlined">battery_full</span>
    </span>
  </header>

  <nav class="c-navbar">
    <a data-back class="c-navbar__back is-text" href="card.html">Done</a>
  </nav>

  <main class="screen-scroll u-gutter">
    <div class="c-staff-id u-mt-32">
      <h1 class="c-staff-id__name">Ana Reyes</h1>
      <p class="c-staff-id__sub">Prestige member · valid until Oct 2027</p>
    </div>
    <div class="u-mt-32">
      <span class="c-qr is-large" role="img" aria-label="Member QR code"></span>
    </div>
    <div class="c-staff-id__fallback">
      <p class="c-staff-id__code">0042 1187</p>
      <div class="c-progress u-mt-24">
        <div class="c-progress__track"><span class="c-progress__bar" style="width: 60%"></span></div>
        <p class="c-progress__label">New code in 0:24</p>
      </div>
      <p class="c-staff-id__help">Staff can type this number if the scan fails</p>
    </div>
  </main>

  <span class="c-homeindicator"></span>

</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="app.js"></script>
</body>
</html>
