<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Subic.Life - Booked</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/light/style.css" rel="stylesheet">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="components.css">
  <link rel="stylesheet" href="screen.css">
  <link rel="stylesheet" href="components-a.css">
  <link rel="stylesheet" href="shell.css">
  <link rel="stylesheet" href="theme.css">
  <script src="shell.js"></script>
</head>
<body>
<div class="phone c-push c-discover c-cgpage c-bkpage">

  <header class="c-statusbar">
    <span>9:41</span>
    <span class="c-statusbar__icons">
      <span class="material-symbols-outlined">signal_cellular_alt</span>
      <span class="material-symbols-outlined">wifi</span>
      <span class="material-symbols-outlined">battery_full</span>
    </span>
  </header>

  <div class="c-dhead c-dhead--push">
    <span class="c-dhead__spacer c-bkdone__gap" aria-hidden="true"></span>
    <span class="c-dhead__title" aria-hidden="true"></span>
    <a class="c-bkdone__done" href="explore.html">Done</a>
  </div>

  <main class="screen-scroll">

    <div class="c-bkdone">
      <i class="ph-light ph-check-circle c-bkdone__tick" aria-hidden="true"></i>
      <h1 class="c-bkdone__title">You're booked</h1>
      <p class="c-bkdone__saved" data-saved></p>
    </div>

    <div class="c-bkplace">
      <img class="c-bkplace__img" data-thumb src="img/card-lighthouse.jpg" alt="">
      <span class="c-bkplace__text"><span class="c-bkplace__name" data-name></span><span class="c-bkplace__sub" data-sub></span></span>
    </div>

    <div class="c-melist c-cgform" data-rows></div>

    <div data-req-block hidden>
      <p class="c-mehead">Your requests</p>
      <p class="c-bkreqtext" data-req-text></p>
    </div>

    <a class="c-cgcal" data-ics href="explore.html" download="booking.ics"><i class="ph-light ph-calendar-plus" aria-hidden="true"></i>Add to calendar</a>
    <p class="c-bkdone__note">Show your card QR at check-in.</p>

  </main>

  <span class="c-homeindicator"></span>

</div>
<script src="data-a.js"></script>
<script src="img/real/manifest.js"></script>
<script src="real-photos.js"></script>
<script>
  (function () {
    var p = placeFor(queryParam('p') || 'lighthouse');
    if (!p.bookable) {
      location.replace('place.html?p=' + p.id);
      return;
    }
    var $ = function (s) { return document.querySelector(s); };
    var i = Number(queryParam('room') || 0);
    var r = p.rooms[i] || p.rooms[0];
    var trip = p.unit === 'trip';
    var tix = p.kind === 'tickets';
    var tm = tix && queryParam('t'), hrs = r.hours, meet = p.meet || 'the gate';
    var hm = function (t, add) {
      var m = Number(t.slice(0, 2)) * 60 + Number(t.slice(2)) + Math.round((add || 0) * 60);
      return String(Math.floor(m / 60)).padStart(2, '0') + String(m % 60).padStart(2, '0');
    };
    var plural = function (n, one, many) { return n + ' ' + (n === 1 ? one : many); };

    // Stays carry their dates, party and free night from Book; trips and old links fall back to the sample day.
    var WK = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'], MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    var parse = function (s) { var m = /^(\d{4})-(\d\d)-(\d\d)$/.exec(s || ''); return m ? new Date(+m[1], m[2] - 1, +m[3]) : null; };
    var dayName = function (d) { return WK[d.getDay()] + ', ' + d.getDate() + ' ' + MON[d.getMonth()]; };
    var stamp = function (d, h) { return d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0') + 'T' + h + '0000'; };
    var checkIn = !trip && parse(queryParam('in')), checkOut = !trip && parse(queryParam('out'));
    var nights = checkIn && checkOut ? Math.round((checkOut - checkIn) / 864e5) : 1;
    var adults = Number(queryParam('a')) || 2, kids = Number(queryParam('c')) || 0;
    var day = tix && (parse(queryParam('d')) || new Date(2026, 9, 18));
    if (tix) {
      // A ticket's price is for the party: adults at the adult rate, children at the child rate where there is one.
      var kid = r.child || r.rate, per = r.per || p.per, cut = function (x) { return Math.round(x * p.discount / 100); };
      r = { name: r.name, rate: r.rate * adults + kid * kids, saved: cut(r.rate) * adults + cut(kid) * kids };
    }
    var off = tix ? r.saved : Math.round(r.rate * p.discount / 100) * nights;
    var free = !trip && queryParam('free') === '1' ? r.rate - Math.round(r.rate * p.discount / 100) : 0;
    var total = r.rate * nights - off - free;

    // The place shows once, in its row; the room and guests sit under its name.
    document.title = 'Subic.Life - Booked ' + p.name;
    $('[data-saved]').textContent = 'You saved ' + fmtPeso(off + free);
    $('[data-thumb]').src = p.thumb;
    $('[data-name]').textContent = p.name;
    $('[data-sub]').textContent = tix
      ? r.name + ' · ' + (per ? plural(adults, per[0], per[1]) : plural(adults + kids, 'guest', 'guests'))
      : checkIn
      ? r.name + ' · ' + plural(nights, 'night', 'nights') + ' · ' + plural(adults + kids, 'guest', 'guests')
      : r.name + ' · 2 guests';

    var row = function (label, value, cls) {
      return '<div class="c-merow"><span class="c-merow__main">' + label + '</span><span class="c-merow__value' + (cls ? ' ' + cls : '') + '">' + value + '</span></div>';
    };
    $('[data-rows]').innerHTML = tix
      ? row('Date', dayName(day), 'c-bkval') +
        (tm ? row('Time', fmtClock(tm) + ' to ' + fmtClock(tm, hrs), 'c-bkval') : '') +
        (per ? row(per[2], plural(adults, per[0], per[1]), 'c-bkval')
          : row('Guests', plural(adults, 'adult', 'adults') + (kids ? ', ' + plural(kids, 'child', 'children') : ''), 'c-bkval')) +
        row('Booking code', p.code, 'c-bkval c-bkcode') +
        row('Paid with GCash', fmtPeso(total), 'c-bkval')
      : row(trip ? p.dates[0] : p.dates[0] + '<span class="c-merow__sub">From 2 PM</span>', checkIn ? dayName(checkIn) : p.dates[2], 'c-bkval') +
      row(trip ? p.dates[1] : p.dates[1] + '<span class="c-merow__sub">By 12 PM</span>', checkOut ? dayName(checkOut) : p.dates[3], 'c-bkval') +
      (free ? row('Free night', 'Used', 'c-bkval') : '') +
      row('Booking code', p.code, 'c-bkval c-bkcode') +
      (total > 0 ? row('Paid with GCash', fmtPeso(total), 'c-bkval') : '');

    var ics = [
      'BEGIN:VCALENDAR',
      'VERSION:2.0',
      'BEGIN:VEVENT',
      'DTSTART:' + (tix ? (tm ? stamp(day, hm(tm)).slice(0, -2) : stamp(day, p.gate[0])) : trip ? '20261017T080000' : checkIn ? stamp(checkIn, 14) : '20261017T140000'),
      'DTEND:' + (tix ? (tm ? stamp(day, hm(tm, hrs)).slice(0, -2) : stamp(day, p.gate[1])) : trip ? '20261017T170000' : checkOut ? stamp(checkOut, 12) : '20261018T120000'),
      'SUMMARY:' + p.name + ' - ' + r.name,
      'LOCATION:' + p.address,
      'DESCRIPTION:Booking code ' + p.code + '. Show your card QR at ' + (tix ? meet + '.' : 'check-in.'),
      'END:VEVENT',
      'END:VCALENDAR'
    ].join('\r\n');
    // What the guest asked the hotel for, as they typed it.
    var req = (queryParam('req') || '').trim();
    if (req && !trip) { $('[data-req-text]').textContent = req; $('[data-req-block]').hidden = false; }

    if (tix) $('.c-bkdone__note').textContent = 'Show your card QR at ' + meet + '.';
    // A way to reach the place after booking: a text where it takes messages (the phone's own app), a call for hotels.
    // It sits beside Add to calendar, so the booked screen stays one screen tall.
    var reach = p.chat ? ['sms:' + p.chat[0], 'chat-circle-text', p.chat[1]]
      : !tix && !trip && p.phone ? ['tel:' + p.phone.replace(/\s/g, ''), 'phone', 'Call'] : null;
    if (reach) {
      var acts = document.createElement('div'), cal = $('[data-ics]');
      acts.className = 'c-bkacts';
      cal.before(acts);
      acts.append(cal);
      acts.insertAdjacentHTML('beforeend', '<a class="c-cgcal" href="' + reach[0] + '"><i class="ph-light ph-' + reach[1] + '" aria-hidden="true"></i>' + reach[2] + '</a>');
    }

    // A stay paid for just now goes into Me > Bookings (this browser only). While it is free to cancel (until two days
    // before check-in, as Confirm and pay says), Booked offers it; cancelling takes it out of Bookings.
    var load = function (k) { try { return JSON.parse(localStorage.getItem(k) || '[]'); } catch (e) { return []; } };
    var keep = function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
    if (checkIn && checkOut && !tix) {
      var key = p.id + '-' + queryParam('in') + '-' + i, mine = load('sl-bookings');
      var has = function () { return load('sl-bookings').some(function (b) { return b.key === key; }); };
      if (queryParam('new') === '1' && !has() && load('sl-bookings-off').indexOf(key) < 0) {
        var span = checkIn.getMonth() === checkOut.getMonth() ? checkIn.getDate() + ' to ' + checkOut.getDate() + ' ' + MON[checkOut.getMonth()]
          : checkIn.getDate() + ' ' + MON[checkIn.getMonth()] + ' to ' + checkOut.getDate() + ' ' + MON[checkOut.getMonth()];
        mine.push({ key: key, name: p.name, sub: r.name + ' · ' + span + ' · Code ' + p.code, thumb: p.thumb,
          href: 'book-done.html' + location.search.replace('&new=1', '') });
        keep('sl-bookings', mine);
      }
      var today = new Date(2026, 9, 17);  // the demo's today, as SLStay.today in stay.js
      var deadline = new Date(checkIn.getFullYear(), checkIn.getMonth(), checkIn.getDate() - 2);
      if (has() && deadline >= today) {
        $('main').insertAdjacentHTML('beforeend', '<button class="c-bkcancel" type="button" data-cancel>Cancel for free until ' + dayName(deadline) + '</button>');
        $('[data-cancel]').addEventListener('click', function () {
          keep('sl-bookings', load('sl-bookings').filter(function (b) { return b.key !== key; }));
          keep('sl-bookings-off', load('sl-bookings-off').concat(key));
          $('.c-bkdone__tick').className = 'ph-light ph-x-circle c-bkdone__tick';
          $('.c-bkdone__title').textContent = 'Booking cancelled';
          $('[data-saved]').textContent = total > 0 ? fmtPeso(total) + ' goes back to GCash' : 'Nothing was charged';
          ['.c-bkacts', '[data-ics]', '.c-bkdone__note', '[data-cancel]'].forEach(function (s) { var el = $(s); if (el) el.style.display = 'none'; });
        });
      }
    }
    var icsLink = $('[data-ics]');
    icsLink.href = 'data:text/calendar;charset=utf-8,' + encodeURIComponent(ics);
    icsLink.setAttribute('download', p.id + '-booking.ics');
  })();
</script>
</body>
</html>
