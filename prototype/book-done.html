<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Subic.Life - Booked</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/light/style.css" rel="stylesheet">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="components.css">
  <link rel="stylesheet" href="screen.css">
  <link rel="stylesheet" href="components-a.css">
  <link rel="stylesheet" href="shell.css">
  <link rel="stylesheet" href="theme.css">
  <script src="shell.js"></script>
</head>
<body>
<div class="phone c-push c-discover c-cgpage c-bkpage">

  <header class="c-statusbar">
    <span>9:41</span>
    <span class="c-statusbar__icons">
      <span class="material-symbols-outlined">signal_cellular_alt</span>
      <span class="material-symbols-outlined">wifi</span>
      <span class="material-symbols-outlined">battery_full</span>
    </span>
  </header>

  <div class="c-dhead c-dhead--push">
    <span class="c-dhead__spacer c-bkdone__gap" aria-hidden="true"></span>
    <span class="c-dhead__title" aria-hidden="true"></span>
    <a class="c-bkdone__done" href="explore.html">Done</a>
  </div>

  <main class="screen-scroll">

    <div class="c-bkdone">
      <i class="ph-light ph-check-circle c-bkdone__tick" aria-hidden="true"></i>
      <h1 class="c-bkdone__title">You're booked</h1>
      <p class="c-bkdone__saved" data-saved></p>
    </div>

    <div class="c-bkplace">
      <img class="c-bkplace__img" data-thumb src="img/card-lighthouse.jpg" alt="">
      <span class="c-bkplace__text"><span class="c-bkplace__name" data-name></span><span class="c-bkplace__sub" data-sub></span></span>
    </div>

    <div class="c-melist c-cgform" data-rows></div>

    <a class="c-cgcal" data-ics href="explore.html" download="booking.ics"><i class="ph-light ph-calendar-plus" aria-hidden="true"></i>Add to calendar</a>
    <p class="c-bkdone__note">Show your card QR at check-in.</p>

  </main>

  <span class="c-homeindicator"></span>

</div>
<script src="data-a.js"></script>
<script>
  (function () {
    var p = placeFor(queryParam('p') || 'lighthouse');
    if (!p.bookable) {
      location.replace('place.html?p=' + p.id);
      return;
    }
    var $ = function (s) { return document.querySelector(s); };
    var i = Number(queryParam('room') || 0);
    var r = p.rooms[i] || p.rooms[0];
    var trip = p.unit === 'trip';
    var plural = function (n, one, many) { return n + ' ' + (n === 1 ? one : many); };

    // Stays carry their dates, party and free night from Book; trips and old links fall back to the sample day.
    var WK = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'], MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    var parse = function (s) { var m = /^(\d{4})-(\d\d)-(\d\d)$/.exec(s || ''); return m ? new Date(+m[1], m[2] - 1, +m[3]) : null; };
    var dayName = function (d) { return WK[d.getDay()] + ', ' + d.getDate() + ' ' + MON[d.getMonth()]; };
    var stamp = function (d, h) { return d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0') + 'T' + h + '0000'; };
    var checkIn = !trip && parse(queryParam('in')), checkOut = !trip && parse(queryParam('out'));
    var nights = checkIn && checkOut ? Math.round((checkOut - checkIn) / 864e5) : 1;
    var adults = Number(queryParam('a')) || 2, kids = Number(queryParam('c')) || 0;
    var off = Math.round(r.rate * p.discount / 100) * nights;
    var free = !trip && queryParam('free') === '1' ? r.rate - Math.round(r.rate * p.discount / 100) : 0;
    var total = r.rate * nights - off - free;

    // The place shows once, in its row; the room and guests sit under its name.
    document.title = 'Subic.Life - Booked ' + p.name;
    $('[data-saved]').textContent = 'You saved ' + fmtPeso(off + free);
    $('[data-thumb]').src = p.thumb;
    $('[data-name]').textContent = p.name;
    $('[data-sub]').textContent = checkIn
      ? r.name + ' · ' + plural(nights, 'night', 'nights') + ' · ' + plural(adults + kids, 'guest', 'guests')
      : r.name + ' · 2 guests';

    var row = function (label, value, cls) {
      return '<div class="c-merow"><span class="c-merow__main">' + label + '</span><span class="c-merow__value' + (cls ? ' ' + cls : '') + '">' + value + '</span></div>';
    };
    $('[data-rows]').innerHTML =
      row(p.dates[0], checkIn ? dayName(checkIn) : p.dates[2], 'c-bkval') +
      row(p.dates[1], checkOut ? dayName(checkOut) : p.dates[3], 'c-bkval') +
      (free ? row('Free night', 'Used', 'c-bkval') : '') +
      row('Booking code', p.code, 'c-bkval c-bkcode') +
      (total > 0 ? row('Paid with GCash', fmtPeso(total), 'c-bkval') : '');

    var ics = [
      'BEGIN:VCALENDAR',
      'VERSION:2.0',
      'BEGIN:VEVENT',
      'DTSTART:' + (trip ? '20261017T080000' : checkIn ? stamp(checkIn, 14) : '20261017T140000'),
      'DTEND:' + (trip ? '20261017T170000' : checkOut ? stamp(checkOut, 12) : '20261018T120000'),
      'SUMMARY:' + p.name + ' - ' + r.name,
      'LOCATION:' + p.address,
      'DESCRIPTION:Booking code ' + p.code + '. Show your card QR at check-in.',
      'END:VEVENT',
      'END:VCALENDAR'
    ].join('\r\n');
    var icsLink = $('[data-ics]');
    icsLink.href = 'data:text/calendar;charset=utf-8,' + encodeURIComponent(ics);
    icsLink.setAttribute('download', p.id + '-booking.ics');
  })();
</script>
</body>
</html>
