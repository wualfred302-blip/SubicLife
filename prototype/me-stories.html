<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Subic.Life - Your stories</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/light/style.css" rel="stylesheet">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="components.css">
  <link rel="stylesheet" href="components-c.css">
  <link rel="stylesheet" href="screen.css">
  <link rel="stylesheet" href="shell.css">
  <link rel="stylesheet" href="theme.css">
  <script src="shell.js"></script>
</head>
<body>
<div class="phone c-push c-discover c-cgpage">

  <header class="c-statusbar">
    <span>9:41</span>
    <span class="c-statusbar__icons">
      <span class="material-symbols-outlined">signal_cellular_alt</span>
      <span class="material-symbols-outlined">wifi</span>
      <span class="material-symbols-outlined">battery_full</span>
    </span>
  </header>

  <div class="c-dhead c-dhead--push">
    <a class="c-dhead__back" data-back href="me.html" aria-label="Back to Me"><i class="ph-light ph-caret-left" aria-hidden="true"></i></a>
    <h1 class="c-dhead__title">Your stories</h1>
    <span class="c-dhead__spacer" aria-hidden="true"></span>
  </div>

  <main class="screen-scroll">

    <section data-share-sec>
      <p class="c-mehead">Visits to share</p>
      <div class="c-melist c-cgform c-msvisits" data-visits></div>
    </section>

    <section data-mine-sec>
      <p class="c-mehead">Shared</p>
      <div class="c-msgrid" data-mine></div>
    </section>

  </main>

  <span class="c-homeindicator"></span>

</div>
<script src="data-a.js"></script>
<script src="data-e.js"></script>
<script>
(function () {
  function esc(t) { return String(t).replace(/[&<>"']/g, function (c) { return '&#' + c.charCodeAt(0) + ';'; }); }

  // Visits paid with the card that have no story yet. Tapping one opens the composer for that visit.
  var visits = visitsToShare();
  document.querySelector('[data-share-sec]').hidden = !visits.length;
  document.querySelector('[data-visits]').innerHTML = visits.map(function (v) {
    var place = PLACES[v.place];
    return '<a class="c-merow c-msvisit" href="story-new.html?p=' + v.place + '&amp;v=' + encodeURIComponent(v.when) + '&amp;from=me-stories.html">' +
      '<img class="c-msvisit__img" src="' + place.thumb + '" alt="">' +
      '<span class="c-merow__main"><span class="c-msvisit__name">' + esc(place.name) + '</span>' +
      '<span class="c-merow__sub">' + esc(v.when) + ' · ' + esc(v.what) + '</span></span>' +
      '<span class="c-msadd"><i class="ph-light ph-plus" aria-hidden="true"></i>Story</span></a>';
  }).join('');

  // The ones you shared, newest first: the photo, then the place and its likes underneath, like Discover's places.
  var mine = FEED.stories.filter(function (s) { return s.mine; });
  document.querySelector('[data-mine-sec]').hidden = !mine.length;
  document.querySelector('[data-mine]').innerHTML = mine.map(function (s) {
    var place = PLACES[s.place];
    return '<a class="c-msstory" href="post.html?id=' + encodeURIComponent(s.id) + '">' +
      '<img class="c-msstory__img" src="' + s.photos[0] + '" alt="">' +
      '<span class="c-msstory__name">' + esc(place.name) + '</span>' +
      '<span class="c-msstory__meta">' + esc(s.visited) + (s.likes ? ' · ' + s.likes + (s.likes === 1 ? ' like' : ' likes') : '') + '</span></a>';
  }).join('');
})();
</script>
</body>
</html>
