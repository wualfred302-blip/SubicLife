<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Subic.Life - Your stories</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="components.css">
  <link rel="stylesheet" href="components-c.css">
  <link rel="stylesheet" href="screen.css">
  <link rel="stylesheet" href="shell.css">
  <link rel="stylesheet" href="theme.css">
  <script src="shell.js"></script>
</head>
<body>
<div class="phone c-push">

  <header class="c-statusbar">
    <span>9:41</span>
    <span class="c-statusbar__icons">
      <span class="material-symbols-outlined">signal_cellular_alt</span>
      <span class="material-symbols-outlined">wifi</span>
      <span class="material-symbols-outlined">battery_full</span>
    </span>
  </header>

  <nav class="c-navbar">
    <a data-back class="c-navbar__back" href="me.html" aria-label="Back to Me">
      <svg class="c-navbar__chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="M15.75 19.5L8.25 12l7.5-7.5"/></svg>
    </a>
    <h1 class="c-navbar__title">Your stories</h1>
    <span></span>
  </nav>

  <main class="screen-scroll">

    <section class="u-gutter u-mt-16" data-share-sec>
      <h2 class="c-section-title is-caption">Visits to share</h2>
      <div data-visits></div>
    </section>

    <section class="u-mt-24">
      <h2 class="c-section-title is-caption u-gutter">Shared</h2>
      <div class="c-mystories" data-mine></div>
    </section>

  </main>

  <span class="c-homeindicator"></span>

</div>
<script src="data-a.js"></script>
<script src="data-e.js"></script>
<script>
(function () {
  // Visits paid with the card that have no story yet. Tapping one opens the composer for that visit.
  var visits = visitsToShare();
  document.querySelector('[data-share-sec]').hidden = !visits.length;
  document.querySelector('[data-visits]').innerHTML = visits.map(function (v) {
    var place = PLACES[v.place];
    return '<a class="c-list-row c-pressable" href="story-new.html?p=' + v.place + '&amp;v=' + encodeURIComponent(v.when) + '&amp;from=me-stories.html">' +
      '<span class="c-list-row__lead"><span class="c-list-row__thumb"><img src="' + place.thumb + '" alt=""></span></span>' +
      '<span class="c-list-row__main"><span class="c-list-row__title">' + place.name + '</span>' +
      '<span class="c-list-row__sub">' + v.when + ' · ' + v.what + '</span></span>' +
      '<span class="c-list-row__trail"><span class="c-addpill"><span class="material-symbols-outlined" aria-hidden="true">add</span>Story</span></span></a>';
  }).join('');

  // The ones you shared, newest first.
  var mine = FEED.stories.filter(function (s) { return s.mine; });
  document.querySelector('[data-mine]').innerHTML = mine.map(function (s) { return storyTile(s, 'own'); }).join('');
})();
</script>
</body>
</html>
