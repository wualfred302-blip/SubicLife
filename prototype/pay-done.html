<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Subic.Life - Paid</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="components.css">
  <link rel="stylesheet" href="components-b.css">
  <link rel="stylesheet" href="screen.css">
  <link rel="stylesheet" href="shell.css">
  <link rel="stylesheet" href="theme.css">
  <script src="shell.js"></script>
  <script src="img/real/manifest.js"></script>
  <script src="real-photos.js"></script>
</head>
<body>
<div class="phone c-phone--push">

  <header class="c-statusbar">
    <span>9:41</span>
    <span class="c-statusbar__icons">
      <span class="material-symbols-outlined">signal_cellular_alt</span>
      <span class="material-symbols-outlined">wifi</span>
      <span class="material-symbols-outlined">battery_full</span>
    </span>
  </header>

  <main class="c-paid">
    <div class="c-success-icon is-lg">
      <svg viewBox="0 0 24 24" aria-hidden="true"><polyline class="c-draw" pathLength="1" points="20 6 9 17 4 12"/></svg>
    </div>

    <h1 class="c-paid__title">Paid ₱1,920</h1>
    <p class="c-paid__sub">Meat Plus Cafe · today 7:42 PM</p>
    <p class="c-paid__save">You saved ₱480</p>

    <div class="c-receipt c-paid__receipt">
      <div class="c-receipt__row"><span>Bill</span><span class="c-receipt__amount">₱2,400</span></div>
      <div class="c-receipt__row is-discount"><span>Prestige discount (20%)</span><span class="c-receipt__amount">−₱480</span></div>
      <div class="c-receipt__row is-total"><span>You paid</span><span class="c-receipt__amount">₱1,920</span></div>
    </div>

    <a class="c-sharevisit c-pressable" href="story-new.html?p=meatplus&amp;v=Today&amp;from=pay-done.html">
      <span class="c-sharevisit__icon"><span class="material-symbols-outlined" aria-hidden="true">add_a_photo</span></span>
      <span class="c-sharevisit__text"><span class="c-sharevisit__title">How was Meat Plus Cafe?</span><span class="c-sharevisit__sub">Share a photo and a tip</span></span>
      <span class="material-symbols-outlined c-sharevisit__chev" aria-hidden="true">chevron_right</span>
    </a>

    <div class="c-paid__actions">
      <a class="c-btn primary" href="card.html">Done</a>
      <a class="c-btn plain" href="card-receipt.html">View receipt</a>
    </div>
  </main>

  <span class="c-homeindicator"></span>

</div>
</body>
</html>
