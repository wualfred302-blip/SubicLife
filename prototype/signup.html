<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Subic.Life - Sign up</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/light/style.css" rel="stylesheet">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="components.css">
  <link rel="stylesheet" href="components-c.css">
  <link rel="stylesheet" href="screen.css">
  <link rel="stylesheet" href="shell.css">
  <link rel="stylesheet" href="theme.css">
  <script src="shell.js"></script>
</head>
<body>
<div class="phone c-discover c-auth c-auth--white">

  <header class="c-statusbar">
    <span>9:41</span>
    <span class="c-statusbar__icons">
      <span class="material-symbols-outlined">signal_cellular_alt</span>
      <span class="material-symbols-outlined">wifi</span>
      <span class="material-symbols-outlined">battery_full</span>
    </span>
  </header>

  <div class="c-dhead c-dhead--push">
    <a class="c-dhead__back" data-back href="join.html" aria-label="Back to ways to join"><i class="ph-light ph-caret-left" aria-hidden="true"></i></a>
    <img class="c-auth__inklogo" src="img/logo-ink.svg" alt="Subic.Life">
    <span class="c-dhead__spacer" aria-hidden="true"></span>
  </div>

  <div class="c-auth__head">
    <h1 class="c-auth__title">What's your mobile number?</h1>
    <p class="c-auth__sub">We'll text you a 6-digit code to join Subic.Life.</p>
  </div>

  <section class="c-auth__sheet">
    <div class="c-auth__field">
      <span class="c-auth__cc">
        <svg class="c-auth__flag" viewBox="0 0 24 16" aria-hidden="true">
          <rect width="24" height="8" fill="#0038A8"/>
          <rect y="8" width="24" height="8" fill="#CE1126"/>
          <polygon points="0,0 11,8 0,16" fill="#FFFFFF"/>
          <circle cx="3.6" cy="8" r="2" fill="#FCD116"/>
        </svg>
        <span>+63</span>
      </span>
      <input class="c-auth__input" type="tel" inputmode="numeric" autocomplete="tel-national" value="917-123-4567" aria-label="Mobile number">
    </div>
    <div class="c-auth__cta">
      <a class="c-auth__send" href="signup-code.html">Send code</a>
    </div>
  </section>

  <span class="c-homeindicator"></span>

</div>
<script src="app.js"></script>
<script>
(function () {
  var input = document.querySelector('.c-auth__input');
  if (!input) return;
  input.addEventListener('input', function () {
    var d = input.value.replace(/\D/g, '').replace(/^0/, '').slice(0, 10);
    input.value = d.length <= 3 ? d : d.length <= 6 ? d.slice(0, 3) + '-' + d.slice(3) : d.slice(0, 3) + '-' + d.slice(3, 6) + '-' + d.slice(6);
  });
})();
</script>
<script src="img/real/manifest.js"></script>
<script src="real-photos.js"></script>
</body>
</html>
