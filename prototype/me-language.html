<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Subic.Life - Language</title><link rel="icon" href="img/icon.svg" type="image/svg+xml"><link rel="icon" href="img/favicon-32.png" sizes="32x32"><link rel="apple-touch-icon" href="img/apple-touch-icon.png"><link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/light/style.css" rel="stylesheet">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="components.css">
  <link rel="stylesheet" href="components-c.css">
  <link rel="stylesheet" href="screen.css">
  <link rel="stylesheet" href="shell.css">
  <link rel="stylesheet" href="theme.css">
  <script src="shell.js"></script>
</head>
<body>
<div class="phone c-push c-discover c-cgpage">

  <header class="c-statusbar">
    <span>9:41</span>
    <span class="c-statusbar__icons">
      <span class="material-symbols-outlined">signal_cellular_alt</span>
      <span class="material-symbols-outlined">wifi</span>
      <span class="material-symbols-outlined">battery_full</span>
    </span>
  </header>

  <div class="c-dhead c-dhead--push">
    <a class="c-dhead__back" data-back href="me.html" aria-label="Back to Me"><i class="ph-light ph-caret-left" aria-hidden="true"></i></a>
    <h1 class="c-dhead__title">Language</h1>
    <span class="c-dhead__spacer" aria-hidden="true"></span>
  </div>

  <main class="screen-scroll">

    <div class="c-melist c-cgform c-lglist" role="radiogroup" aria-label="App language">
      <label class="c-merow c-pick">
        <input class="c-pick__input" type="radio" name="lang" value="English" checked>
        <span class="c-merow__main">English</span>
        <i class="ph-light ph-check c-pick__mark" aria-hidden="true"></i>
      </label>
      <label class="c-merow c-pick">
        <input class="c-pick__input" type="radio" name="lang" value="Filipino">
        <span class="c-merow__main" lang="fil">Filipino</span>
        <i class="ph-light ph-check c-pick__mark" aria-hidden="true"></i>
      </label>
      <label class="c-merow c-pick">
        <input class="c-pick__input" type="radio" name="lang" value="Korean">
        <span class="c-merow__main" lang="ko">한국어</span>
        <i class="ph-light ph-check c-pick__mark" aria-hidden="true"></i>
      </label>
      <label class="c-merow c-pick">
        <input class="c-pick__input" type="radio" name="lang" value="Chinese">
        <span class="c-merow__main" lang="zh">中文</span>
        <i class="ph-light ph-check c-pick__mark" aria-hidden="true"></i>
      </label>
      <label class="c-merow c-pick">
        <input class="c-pick__input" type="radio" name="lang" value="Japanese">
        <span class="c-merow__main" lang="ja">日本語</span>
        <i class="ph-light ph-check c-pick__mark" aria-hidden="true"></i>
      </label>
    </div>

  </main>

  <span class="c-homeindicator"></span>

</div>
<script src="app.js"></script>
<script src="img/real/manifest.js"></script>
<script src="real-photos.js"></script>
</body>
</html>
