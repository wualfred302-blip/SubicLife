<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFFFFF">
  <title>Subic.Life - Concierge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/light/style.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/thin/style.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css" rel="stylesheet">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="components.css">
  <link rel="stylesheet" href="components-c.css">
  <link rel="stylesheet" href="components-g.css">
  <link rel="stylesheet" href="screen.css">
  <link rel="stylesheet" href="shell.css">
  <link rel="stylesheet" href="theme.css">
  <script src="shell.js"></script>
</head>
<body>
<div class="phone c-discover c-cgpage">

  <header class="c-statusbar">
    <span>9:41</span>
    <span class="c-statusbar__icons">
      <span class="material-symbols-outlined">signal_cellular_alt</span>
      <span class="material-symbols-outlined">wifi</span>
      <span class="material-symbols-outlined">battery_full</span>
    </span>
  </header>

  <div class="c-dhead">
    <h1 class="c-dhead__title">Concierge</h1>
  </div>

  <main class="screen-scroll">

    <div class="c-meprof c-cgmika">
      <span class="c-cgav" aria-hidden="true">MK</span>
      <span class="c-meprof__text"><span class="c-meprof__name">Mika</span><span class="c-meprof__sub">Online · replies in ~5 min</span></span>
      <a class="c-cgcall" href="tel:+63472520800" aria-label="Call Mika"><i class="ph-thin ph-phone" aria-hidden="true"></i></a>
    </div>

    <a class="c-cgask" href="concierge-chat.html?topic=other" aria-label="Ask Mika for anything">
      <span class="c-cgask__text" aria-hidden="true">Ask Mika for <span class="c-cgask__roll">anything</span></span>
      <i class="ph-light ph-arrow-up" aria-hidden="true"></i>
    </a>

    <section aria-labelledby="trip-title">
      <div class="c-cgsec">
        <h2 class="c-cgsec__title" id="trip-title">Your trip</h2>
        <a class="c-cgsec__link" href="concierge-trip.html">Itinerary</a>
      </div>
      <p class="c-cgsec__sub" id="trip-dates"></p>
      <div id="trip-days"></div>
    </section>

  </main>
  <nav class="c-tabbar c-tabbar--flat" aria-label="Sections">
    <a class="c-tabbar__tab" href="map.html"><i class="ph-thin ph-map-trifold c-tabbar__icon" aria-hidden="true"></i>Map</a>
    <a class="c-tabbar__tab" href="explore.html"><i class="ph-thin ph-compass c-tabbar__icon" aria-hidden="true"></i>Discover</a>
    <a class="c-tabbar__tab" href="card.html"><i class="ph-thin ph-credit-card c-tabbar__icon" aria-hidden="true"></i>Card</a>
    <a class="c-tabbar__tab is-active" href="concierge.html" aria-current="page"><i class="ph-thin ph-chat-circle c-tabbar__icon" aria-hidden="true"></i>Concierge</a>
    <a class="c-tabbar__tab" href="me.html"><i class="ph-thin ph-user-circle c-tabbar__icon" aria-hidden="true"></i>Me</a>
  </nav>
  <span class="c-homeindicator"></span>

</div>
<script src="data-g.js"></script>
<script>
(function () {
  var C = window.CONCIERGE;

  // The ask bar rolls through what Mika arranges; the chat opens with the same services as chips.
  // Kept still for people who turn motion off.
  var roll = document.querySelector('.c-cgask__roll');
  var asks = ['anything', 'a table tonight', 'a ride from Clark', 'a yacht charter', 'island hopping', 'a tee time', 'a spa day'];
  var still = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (roll && !still) {
    var at = 0;
    setInterval(function () {
      roll.classList.add('is-out');
      setTimeout(function () {
        at = (at + 1) % asks.length;
        roll.textContent = asks[at];
        roll.classList.remove('is-out');
        roll.classList.add('is-in');
        void roll.offsetWidth;
        roll.classList.remove('is-in');
      }, 250);
    }, 2800);
  }

  // The whole trip, one hairline list per day. Only a stop Mika is still arranging is called out in words.
  // Tapping a stop opens it.
  var days = document.getElementById('trip-days');
  var count = 0;
  C.TRIP.days.forEach(function (d) {
    var day = document.createElement('div');
    day.className = 'c-cgday';
    day.innerHTML = '<h3 class="c-mehead">' + d.label + '</h3>';
    var list = document.createElement('div');
    list.className = 'c-melist';
    d.items.forEach(function (i) {
      var r = document.createElement('a');
      r.className = 'c-merow c-cgstop';
      r.href = i.href;
      r.innerHTML =
        '<span class="c-cgstop__clock"><span class="c-cgstop__hm">' + i.time.split(' ')[0] + '</span>' +
        '<span class="c-cgstop__ampm">' + (i.time.split(' ')[1] || '') + '</span></span>' +
        '<span class="c-merow__main">' +
        '<span class="c-cgstop__name">' + i.title + '</span>' +
        '<span class="c-merow__sub">' + i.sub + (i.status === 'confirmed' ? '<span class="u-sr"> · Confirmed</span>' : '') + '</span>' +
        (i.status === 'progress' ? '<span class="c-cgstop__status">Mika is on it</span>' : '') +
        '</span>' +
        (i.photo === false ? '' : '<img class="c-cgstop__thumb" alt="" src="' + i.img + '">');
      list.appendChild(r);
      count++;
    });
    day.appendChild(list);
    days.appendChild(day);
  });
  document.getElementById('trip-dates').textContent = C.TRIP.dates + ' · ' + count + ' plans';
})();
</script>
<script src="app.js"></script>
<script src="img/real/manifest.js"></script>
<script src="real-photos.js"></script>
</body>
</html>
