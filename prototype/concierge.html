<body>
<div class="c-cx c-cx--b phone c-discover c-cgpage c-nolines">

  <header class="c-statusbar">
    <span>9:41</span>
    <span class="c-statusbar__icons">
      <span class="material-symbols-outlined">signal_cellular_alt</span>
      <span class="material-symbols-outlined">wifi</span>
      <span class="material-symbols-outlined">battery_full</span>
    </span>
  </header>

  <main class="screen-scroll">
    <a class="c-cxb__sos" href="emergency.html"><i class="ph-light ph-first-aid" aria-hidden="true"></i><span><b>Travel emergency help, 24/7</b><span>By Assist&nbsp;America · included with your card</span></span><i class="ph-light ph-caret-right" aria-hidden="true"></i></a>
    <a class="c-cxb__trip" href="concierge-trip.html"><span><b>Your trip</b><span id="dates"></span></span><i class="ph-light ph-caret-right" aria-hidden="true"></i></a>
    <h2 class="c-cx__h">What we can arrange</h2>
    <div class="c-cxb__feed" id="ideas"></div>
    <a class="c-cxb__make" href="concierge-chat.html?topic=other">Make a request</a>
  </main>
  <nav class="c-tabbar c-tabbar--flat" aria-label="Sections">
    <a class="c-tabbar__tab" href="map.html"><i class="ph-thin ph-map-trifold c-tabbar__icon" aria-hidden="true"></i>Map</a>
    <a class="c-tabbar__tab" href="explore.html"><i class="ph-thin ph-compass c-tabbar__icon" aria-hidden="true"></i>Discover</a>
    <a class="c-tabbar__tab" href="card.html"><i class="ph-thin ph-credit-card c-tabbar__icon" aria-hidden="true"></i>Card</a>
    <a class="c-tabbar__tab is-active" href="concierge.html" aria-current="page"><i class="ph-thin ph-chat-circle c-tabbar__icon" aria-hidden="true"></i>Concierge</a>
    <a class="c-tabbar__tab" href="me.html"><i class="ph-thin ph-user-circle c-tabbar__icon" aria-hidden="true"></i>Me</a>
  </nav>
  <span class="c-homeindicator"></span>

</div>
<script src="data-g.js"></script>
<script>
(function () {
  var C = window.CONCIERGE, X = C.EXPERIENCES, all = [];
  C.TRIP.days.forEach(function (d) { d.items.forEach(function (i) { all.push({ day: d.label, i: i }); }); });
  var dates = document.getElementById('dates');
  if (dates) dates.textContent = C.TRIP.dates + ' · ' + all.length + ' plans';
  function tag(i) { return '<span class="c-cx__tag' + (i.status === 'progress' ? ' is-live' : '') + '">' + (i.status === 'progress' ? 'Arranging' : 'Confirmed') + '</span>'; }
  var plan = document.getElementById('plan');
  if (plan) {
    var last = '';
    plan.innerHTML = all.map(function (r) {
      var head = r.day !== last ? '<h3 class="c-cx__day">' + r.day + '</h3>' : ''; last = r.day;
      return head + '<a class="c-cx__stop" href="' + r.i.href + '"><span class="c-cx__time">' + r.i.time + '</span>' +
        '<span class="c-cx__main"><span class="c-cx__name">' + r.i.title + '</span><span class="c-cx__sub">' + r.i.sub + '</span>' + tag(r.i) + '</span>' +
        (r.i.photo === false || false ? '' : '<img class="c-cx__img" src="' + r.i.img + '" alt="" width="64" height="64" loading="lazy">') + '</a>';
    }).join('');
  }
  var next = document.getElementById('next');
  if (next) {
    var first = all[0], pic = first.i.photo !== false;
    next.href = first.i.href;
    if (!pic) next.classList.add('is-text');
    next.innerHTML = (pic ? '<img src="' + first.i.img + '" alt="">' : '') +
      '<span class="c-cxa__cap"><span class="c-cxa__when">Next · ' + first.day + ', ' + first.i.time + '</span>' +
      '<span class="c-cxa__what">' + first.i.title + '</span>' + tag(first.i) + '</span>';
  }
  // The message each photo puts in the chat box, ready to send.
  var DRAFTS = {
    yacht: 'I\u2019d like to charter a yacht.',
    dining: 'I\u2019d like to book a private dinner.',
    island: 'I\u2019d like to go island hopping.',
    golf: 'I\u2019d like to book a round of golf.',
    spa: 'I\u2019d like to book a spa day.',
    transfer: 'I need a car to or from the airport.'
  };
  var ideas = document.getElementById('ideas');
  if (ideas) ideas.innerHTML = Object.keys(X).map(function (k) {
    return '<a class="c-cxb__card" href="concierge-chat.html?topic=' + k + '&draft=' + encodeURIComponent(DRAFTS[k] || 'I\u2019d like help with ' + X[k].title.toLowerCase() + '.') + '"><img src="' + X[k].img + '" alt="" loading="lazy">' +
      '<span class="c-cxb__title">' + X[k].title + '</span></a>';
  }).join('');
  var chips = document.getElementById('chips');
  if (chips) chips.innerHTML = Object.keys(X).map(function (k) {
    return '<a class="c-cxc__chip" href="concierge-request.html?type=' + k + '">' + X[k].title + '</a>';
  }).join('');
})();
</script>
<script src="app.js"></script>
<script src="img/real/manifest.js"></script>
<script src="real-photos.js"></script>
</body>
</html>
