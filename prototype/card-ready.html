<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Subic.Life - Your card is ready</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="components.css">
  <link rel="stylesheet" href="components-c.css">
  <link rel="stylesheet" href="screen.css">
  <link rel="stylesheet" href="shell.css">
  <link rel="stylesheet" href="theme.css">
  <script src="shell.js"></script>
</head>
<body>
<div class="phone theme-night is-onboard c-push">

  <header class="c-statusbar">
    <span>9:41</span>
    <span class="c-statusbar__icons">
      <span class="material-symbols-outlined">signal_cellular_alt</span>
      <span class="material-symbols-outlined">wifi</span>
      <span class="material-symbols-outlined">battery_full</span>
    </span>
  </header>

  <main class="screen-scroll">

    <section class="u-gutter u-mt-8">
      <h2 class="c-section-title is-title">Your card is ready</h2>
    </section>

    <section class="u-gutter u-mt-24 c-cardstage">
      <div class="c-mcard is-prestige is-portrait" id="ready-card">
        <div class="c-mcard__flipper">
          <div class="c-mcard__face c-mcard__front">
            <span class="c-mcard__sheen" aria-hidden="true"></span>
            <span class="c-mcard__ghost" aria-hidden="true"><span>Su</span><span>bic</span></span>
            <span class="c-mcard__brand">Subic.Life</span>
            <span class="c-mcard__foot" id="ready-foot">Ana Reyes · Prestige member</span>
          </div>
        </div>
      </div>
    </section>

    <section class="u-gutter u-mt-32">
    </section>

    <section class="u-gutter u-mt-12">
      <a class="c-btn primary" href="map.html">See the map</a>
    </section>

  </main>

  <span class="c-homeindicator"></span>

</div>
<script>
(function () {
  var tiers = ['premium', 'prestige', 'elite'];
  var names = { premium: 'Premium', prestige: 'Prestige', elite: 'Elite' };

  var requested = new URLSearchParams(window.location.search).get('tier');
  var tier = tiers.indexOf(requested) !== -1 ? requested : 'prestige';

  var card = document.getElementById('ready-card');
  tiers.forEach(function (t) { card.classList.remove('is-' + t); });
  card.classList.add('is-' + tier);
  document.getElementById('ready-foot').textContent = 'Ana Reyes · ' + names[tier] + ' member';
})();
</script>
<script src="app.js"></script>
<script src="img/real/manifest.js"></script>
<script src="real-photos.js"></script>
</body>
</html>
