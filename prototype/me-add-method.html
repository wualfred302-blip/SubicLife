<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Subic.Life - Add a method</title><link rel="icon" href="img/icon.svg" type="image/svg+xml"><link rel="icon" href="img/favicon-32.png" sizes="32x32"><link rel="apple-touch-icon" href="img/apple-touch-icon.png"><link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/light/style.css" rel="stylesheet">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="components.css">
  <link rel="stylesheet" href="components-c.css">
  <link rel="stylesheet" href="screen.css">
  <link rel="stylesheet" href="shell.css">
  <link rel="stylesheet" href="theme.css">
  <script src="shell.js"></script>
</head>
<body>
<div class="phone c-push c-discover c-cgpage c-pmpage">

  <header class="c-statusbar">
    <span>9:41</span>
    <span class="c-statusbar__icons">
      <span class="material-symbols-outlined">signal_cellular_alt</span>
      <span class="material-symbols-outlined">wifi</span>
      <span class="material-symbols-outlined">battery_full</span>
    </span>
  </header>

  <div class="c-dhead c-dhead--push">
    <a class="c-dhead__back" data-back href="me.html" aria-label="Back to Me"><i class="ph-light ph-caret-left" aria-hidden="true"></i></a>
    <h1 class="c-dhead__title">Payment methods</h1>
    <span class="c-dhead__spacer" aria-hidden="true"></span>
  </div>

  <main class="screen-scroll">

    <div class="c-melist c-cgform c-pmlist">
      <div class="c-merow">
        <span class="c-pmark c-pm c-pm--gcash" aria-hidden="true">G</span>
        <span class="c-merow__main">GCash</span>
        <span class="c-merow__value">Default</span>
      </div>
      <div class="c-merow">
        <span class="c-pmark c-pm c-pm--maya" aria-hidden="true">M</span>
        <span class="c-merow__main">Maya</span>
      </div>
      <div class="c-merow">
        <span class="c-pmark c-pm c-pm--visa" aria-hidden="true">VISA</span>
        <span class="c-merow__main">Visa •• 4242</span>
      </div>
      <a class="c-merow" href="me-add-method.html">
        <span class="c-merow__lead"><i class="ph-light ph-plus" aria-hidden="true"></i></span>
        <span class="c-merow__main">Add method</span>
        <i class="ph-light ph-caret-right c-merow__chev" aria-hidden="true"></i>
      </a>
    </div>

    <p class="c-pmnote">Member payments at partner counters use your default method.</p>

  </main>

  <div class="c-sheet c-sheet--up c-pmsheet">
    <a class="c-sheet__scrim" href="me-payment-methods.html" aria-label="Close"></a>
    <div class="c-sheet__panel">
      <div class="c-sheet__grabber" aria-hidden="true"></div>
      <div class="c-sheet__body">
        <h2 class="c-sheet__title">Add a method</h2>
        <p class="c-sheet__sub">Choose how you pay at partner counters.</p>
      </div>
      <div class="c-melist c-cgform c-pmlist">
        <a class="c-merow" href="me-payment-methods.html">
          <span class="c-pmark c-pm c-pm--gcash" aria-hidden="true">G</span>
          <span class="c-merow__main">GCash</span>
          <i class="ph-light ph-caret-right c-merow__chev" aria-hidden="true"></i>
        </a>
        <a class="c-merow" href="me-payment-methods.html">
          <span class="c-pmark c-pm c-pm--maya" aria-hidden="true">M</span>
          <span class="c-merow__main">Maya</span>
          <i class="ph-light ph-caret-right c-merow__chev" aria-hidden="true"></i>
        </a>
        <a class="c-merow" href="me-payment-methods.html">
          <span class="c-merow__lead"><i class="ph-light ph-credit-card" aria-hidden="true"></i></span>
          <span class="c-merow__main">Credit or debit card</span>
          <i class="ph-light ph-caret-right c-merow__chev" aria-hidden="true"></i>
        </a>
      </div>
      <div class="c-sheet__actions">
        <a class="c-cgcal" href="me-payment-methods.html">Cancel</a>
      </div>
    </div>
  </div>

  <span class="c-homeindicator"></span>

</div>
<script src="app.js"></script>
<script src="img/real/manifest.js"></script>
<script src="real-photos.js"></script>
</body>
</html>
