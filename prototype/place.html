<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Subic.Life - Partner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/light/style.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css" rel="stylesheet">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="components.css">
  <link rel="stylesheet" href="screen.css">
  <link rel="stylesheet" href="components-a.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="shell.css">
  <link rel="stylesheet" href="theme.css">
  <script src="shell.js"></script>
</head>
<body>
<div class="phone is-pushed has-bottombar c-offerx c-offerwhite c-placewhite">

  <header class="c-statusbar is-overlay">
    <span>9:41</span>
    <span class="c-statusbar__icons">
      <span class="material-symbols-outlined">signal_cellular_alt</span>
      <span class="material-symbols-outlined">wifi</span>
      <span class="material-symbols-outlined">battery_full</span>
    </span>
  </header>

  <div class="c-xbar" aria-hidden="true"><a class="c-xbar__back" href="explore.html" data-back tabindex="-1"><i class="ph-light ph-caret-left" aria-hidden="true"></i></a><span class="c-xbar__title is-small" data-barname></span><span style="width:32px"></span></div>

  <main class="screen-scroll">

    <div class="c-placehero">
      <div class="c-placehero__track" data-gallery data-snap></div>
      <span class="c-placehero__count" data-count></span>
      <div class="c-placehero__bar">
        <a class="c-circle-btn" href="explore.html" data-back aria-label="Back to Explore"><i class="ph-light ph-caret-left" aria-hidden="true"></i></a>
        <div class="c-placehero__right">
          <button class="c-circle-btn" type="button" aria-pressed="false" aria-label="Save place" data-save><i class="ph-light ph-bookmark-simple" aria-hidden="true"></i></button>
          <a class="c-circle-btn" data-share href="mailto:" aria-label="Share place"><i class="ph-light ph-export" aria-hidden="true"></i></a>
        </div>
      </div>
    </div>

    <div class="c-offerbody">

      <div class="u-gutter c-offer-head">
        <h1 class="c-offer-title" data-name>Partner</h1>
        <p class="c-offer-tier" data-meta></p>
        <div class="c-bigcard__stats c-plfacts" data-facts></div>
      </div>

      <a class="c-pperk" data-deal href="offer.html">
        <span class="c-minicard" aria-hidden="true"></span>
        <span class="c-pperk__text"><span class="c-pperk__title" data-otitle></span><span class="c-pperk__sub" data-osub></span></span>
        <i class="ph-light ph-caret-right c-pperk__chev" aria-hidden="true"></i>
      </a>

      <section class="c-osec">
        <h2 class="c-section-title">About</h2>
        <p class="c-pabout" data-about></p>
      </section>

      <section class="c-osec" data-rooms-sec hidden>
        <h2 class="c-section-title" data-rooms-title>Rooms</h2>
        <div class="c-melist c-cgform c-plpick" data-pick hidden>
          <button class="c-merow c-bkpick" type="button" data-open="dates">
            <span class="c-merow__main">Dates<span class="c-merow__sub" data-nights hidden></span></span>
            <span class="c-merow__value c-bkval is-empty" data-range>Add dates</span>
            <i class="ph-light ph-caret-right c-merow__chev" aria-hidden="true"></i>
          </button>
          <button class="c-merow c-bkpick" type="button" data-open="guests">
            <span class="c-merow__main">Guests</span>
            <span class="c-merow__value c-bkval" data-party>2 adults</span>
            <i class="ph-light ph-caret-right c-merow__chev" aria-hidden="true"></i>
          </button>
        </div>
        <div class="c-melist c-plrooms" data-rooms></div>
      </section>

      <section class="c-osec" data-stories-sec hidden>
        <div class="c-plhead"><h2 class="c-section-title">Stories from members</h2><a class="c-cgsec__link" data-stories-all href="place-stories.html" hidden>See all</a></div>
        <div class="c-plstories" data-stories></div>
      </section>

      <section class="c-osec">
        <h2 class="c-section-title">Hours and location</h2>
        <a class="c-pmap" data-maplink href="map.html" aria-label="Show this place on the map">
          <span class="c-mapthumb__live" id="minimap"></span>
        </a>
        <div class="c-melist c-plinfo" data-info></div>
      </section>

    </div>

  </main>

  <div class="c-bottombar">
    <div class="c-obar__price" data-barprice hidden></div>
    <a class="c-btn primary is-full" data-action href="book.html">Book</a>
  </div>

  <span class="c-homeindicator"></span>

</div>
<script src="data-a.js"></script>
<script src="data-e.js"></script>
<script src="stay.js"></script>
<script src="saved.js"></script>
<script src="map-data.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.js"></script>
<script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.0.22/leaflet-maplibre-gl.js"></script>
<script src="map-vector.js"></script>
<script>
  (function () {
    var p = placeFor(queryParam('p') || 'lighthouse');
    var $ = function (s) { return document.querySelector(s); };

    // Photo gallery: swipe through, with a "1 / 4" counter like Photos.
    var photos = p.photos || [p.hero];
    var gal = $('[data-gallery]'), count = $('[data-count]');
    gal.innerHTML = photos.map(function (src, i) {
      return '<img src="' + src + '" alt="' + p.name + ', photo ' + (i + 1) + '"' + (i ? ' loading="lazy"' : '') + '>';
    }).join('');
    function syncCount() { count.textContent = (Math.round(gal.scrollLeft / gal.clientWidth) + 1) + ' / ' + photos.length; }
    count.hidden = photos.length < 2;
    gal.addEventListener('scroll', syncCount, { passive: true });
    document.querySelector('main').style.setProperty('--ph', 'url(' + photos[0] + ')');
    syncCount();
    $('[data-name]').textContent = p.name;
    $('[data-barname]').textContent = p.name;
    var phone = document.querySelector('.phone'), main = document.querySelector('main');
    main.addEventListener('scroll', function () { phone.classList.toggle('is-scrolled', main.scrollTop > 230); }, { passive: true });
    $('[data-meta]').textContent = p.category + ' · ' + p.area;
    // The same three facts as Discover's Popular cards: blue distance, gold rating, indigo closing time.
    var fact = function (icon, tone, value, label) {
      return '<span class="c-bigcard__stat"><i class="' + icon + ' c-bigcard__icon is-' + tone + '" aria-hidden="true"></i>' +
        '<span class="c-bigcard__text"><span class="c-bigcard__value">' + value + '</span><span class="c-bigcard__label">' + label + '</span></span></span>';
    };
    $('[data-facts]').innerHTML = fact('ph-light ph-navigation-arrow', 'blue', p.distance, 'Away') + fact('ph-fill ph-star', 'gold', p.rating, 'Rating') +
      fact('ph-light ph-clock', 'indigo', p.closes.replace('closes ', ''), 'Closes');

    // The member offer gets its own row under the name; the price waits in the bottom bar beside
    // the action, so each fact shows once.
    var offer = ((window.FEED && FEED.offers) || []).filter(function (o) { return o.place === p.id; })[0];
    var deal = $('[data-deal]');
    if (offer) {
      deal.href = 'offer.html?id=' + offer.id;
      $('[data-otitle]').textContent = offer.title;
      $('[data-osub]').textContent = 'Prestige perk · ' + (p.bookable ? 'applied when you book' : p.discount ? 'show your card to pay' : 'with any bill');
    } else {
      deal.hidden = true;
    }
    var member = function (rate) { return rate - Math.round(rate * p.discount / 100); };
    var action = $('[data-action]');
    if (p.bookable) {
      // Stays check availability first, like Airbnb: Dates and Guests rows over the rooms open the same sheets as
      // Confirm and pay. Until there are dates, the bar quotes the cheapest room a night and its button opens the
      // calendar; with dates, every price is for the whole stay and the button reserves the cheapest room that fits.
      var rooms = p.rooms || [];
      var bar = $('[data-barprice]');
      bar.hidden = false;
      action.classList.remove('is-full');
      $('[data-rooms-sec]').hidden = !rooms.length;
      $('[data-rooms-title]').textContent = p.unit === 'night' ? 'Rooms' : 'Tours';
      var order = rooms.map(function (r, i) { return i; }).sort(function (a, b) { return rooms[a].rate - rooms[b].rate; });
      var sleeps = rooms.map(function (r) { var m = /sleeps (\d+)/.exec(r.sub); return m ? Number(m[1]) : 99; });
      var f = window.SLStay && SLStay.fmt;
      var picker = p.unit === 'night' && rooms.length && f && SLStay({
        checkIn: f.parse(queryParam('in')), checkOut: f.parse(queryParam('out')),
        adults: Number(queryParam('a')) || 2, kids: Number(queryParam('c')) || 0,
        maxParty: Math.max.apply(null, sleeps), optional: true, onChange: function () { draw(); }
      });
      $('[data-pick]').hidden = !picker;
      var draw = function () {
        var s = picker ? picker.state : null;
        var n = s && s.checkOut ? f.nights(s.checkIn, s.checkOut) : 0;
        var q = (n ? '&in=' + f.iso(s.checkIn) + '&out=' + f.iso(s.checkOut) : '') + (s ? '&a=' + s.adults + '&c=' + s.kids : '');
        var fits = order.filter(function (i) { return !s || sleeps[i] >= s.adults + s.kids; });
        $('[data-rooms]').innerHTML = order.map(function (i) {
          var r = rooms[i], full = fits.indexOf(i) < 0;
          return '<a class="c-merow c-plroom' + (full ? ' is-full" aria-disabled="true"' : '" href="book.html?p=' + p.id + '&amp;room=' + i + q.replace(/&/g, '&amp;') + '"') + '>' +
            '<img class="c-bkroom__img" src="' + (r.photo || p.hero) + '" alt="">' +
            '<span class="c-merow__main"><span class="c-bkroom__name">' + r.name + '</span><span class="c-merow__sub">' + r.sub + '</span>' +
            '<span class="c-bkroom__price">' + fmtPeso(member(r.rate) * (n || 1)) + '<span class="c-plroom__unit"> ' + (n ? 'for ' + f.plural(n, 'night', 'nights') : '/ ' + p.unit) + '</span>' +
            ' <s>' + fmtPeso(r.rate * (n || 1)) + '</s></span></span>' +
            '<i class="ph-light ph-caret-right c-merow__chev" aria-hidden="true"></i></a>';
        }).join('');
        var low = fits.length ? rooms[fits[0]] : (rooms[order[0]] || { rate: p.rackPrice });
        // Like Airbnb: the price in ink with what it covers; under it the dates (or "Add dates"), which open the calendar.
        bar.innerHTML = '<span class="c-obar__line">' + (fits.length > 1 ? 'From ' : '') + '<b>' + fmtPeso(member(low.rate) * (n || 1)) + '</b>' +
          (n ? ' total' : p.unit === 'night' ? ' night' : ' / ' + p.unit) + '</span>' +
          (picker
            ? '<button class="c-obar__dates" type="button" data-bar-dates>' + (n ? f.short(s.checkIn, s.checkOut) + ' · ' + f.plural(n, 'night', 'nights') : 'Add dates') + '</button>'
            : '<span class="c-obar__sub">' + p.discount + '% off</span>');
        action.textContent = n ? 'Reserve' : 'Check availability';
        action.href = 'book.html?p=' + p.id + (fits.length ? '&room=' + fits[0] : '') + q;
        if (picker) {
          $('[data-range]').textContent = n ? f.range(s.checkIn, s.checkOut) : 'Add dates';
          $('[data-range]').classList.toggle('is-empty', !n);
          $('[data-nights]').hidden = !n;
          $('[data-nights]').textContent = n ? f.plural(n, 'night', 'nights') : '';
          $('[data-party]').textContent = f.party(s.adults, s.kids);
          // Keep the stay in the address, so coming back from Confirm and pay shows the same dates.
          try { history.replaceState(null, '', 'place.html?p=' + p.id + q); } catch (e) {}
        }
      };
      bar.addEventListener('click', function (e) { if (e.target.closest('[data-bar-dates]')) picker.open('dates', action); });
      // Without dates, the bar's button opens the calendar instead of leaving the page.
      action.addEventListener('click', function (e) {
        if (picker && !picker.state.checkOut) { e.preventDefault(); picker.open('dates', action); }
      });
      draw();
    }
    $('[data-about]').textContent = p.about || '';

    // Stories from members who paid here with the card: a swipe row of cards (newest first), "See all" opening
    // every story for this place as Discover posts. A visit of yours without a story puts the share field on top.
    var stories = FEED.stories.filter(function (s) { return s.place === p.id; });
    var visit = visitsToShare().filter(function (v) { return v.place === p.id; })[0];
    if (stories.length || visit) {
      $('[data-stories-sec]').hidden = false;
      var all = $('[data-stories-all]');
      all.hidden = !stories.length;
      all.href = 'place-stories.html?p=' + p.id;
      all.setAttribute('aria-label', 'See all ' + stories.length + ' stories from members');
      $('[data-stories]').innerHTML = (visit
        ? '<a class="c-dcompose" href="story-new.html?p=' + p.id + '&amp;v=' + encodeURIComponent(visit.when) +
            '&amp;from=' + encodeURIComponent('place.html?p=' + p.id) + '">' +
            '<span class="c-dcompose__face"><img src="img/avatar.jpg" alt=""></span>' +
            '<span class="c-dcompose__field">Share a story from your visit<i class="ph-light ph-image" aria-hidden="true"></i></span></a>'
        : '') +
        (stories.length ? '<div class="c-plstory-row" data-snap>' + stories.map(storyCard).join('') + '</div>' : '');
    }

    // A real, still map of the spot. Tapping it opens the full map.
    var spot = window.L && ((window.MAP_DATA && MAP_DATA.places) || []).filter(function (m) { return m.id === p.id; })[0];
    if (spot) {
      var mini = L.map('minimap', { zoomControl: false, attributionControl: false, dragging: false, scrollWheelZoom: false, doubleClickZoom: false, touchZoom: false, boxZoom: false, keyboard: false })
        .setView([spot.lat, spot.lng], 15);
      // Same cool grey vector streets as the Map tab; the old raster tiles only if the style can't load.
      var raster = function () { L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19 }).addTo(mini); };
      if (window.SLMapStyle && L.maplibreGL) {
        var gl = L.maplibreGL({ style: { version: 8, sources: {}, layers: [] }, interactive: false }).addTo(mini);
        SLMapStyle().then(function (s) { gl.getMaplibreMap().setStyle(s); }).catch(function () { mini.removeLayer(gl); raster(); });
      } else {
        raster();
      }
      // The place's own photo is the pin, as places show everywhere else.
      L.marker([spot.lat, spot.lng], { icon: L.divIcon({ className: 'c-minipin is-photo', html: '<img src="' + p.thumb + '" alt="">', iconSize: [44, 44] }) }).addTo(mini);
    }
    // Hours and location as Me-style rows: a light icon and the fact itself, a chevron when the row opens
    // something. A hotel's check-in and check-out get a row each; the address splits into place and area.
    var lead = function (icon) { return '<span class="c-merow__lead"><i class="ph-light ph-' + icon + '" aria-hidden="true"></i></span>'; };
    var chev = '<i class="ph-light ph-caret-right c-merow__chev" aria-hidden="true"></i>';
    var cut = p.address.indexOf(', ');
    $('[data-info]').innerHTML = p.hours.split(' · ').map(function (h) {
      h = h.charAt(0).toUpperCase() + h.slice(1);
      return '<div class="c-merow">' + lead(/^Check-in/.test(h) ? 'sign-in' : /^Check-out/.test(h) ? 'sign-out' : 'clock') +
        '<span class="c-merow__main">' + h + '</span></div>';
    }).join('') +
      '<a class="c-merow" href="' + mapsUrl(p) + '" target="_blank" rel="noopener" aria-label="Directions to ' + p.address + '">' + lead('map-pin') +
      '<span class="c-merow__main">' + (cut > 0 ? p.address.slice(0, cut) + '<span class="c-merow__sub">' + p.address.slice(cut + 2) + '</span>' : p.address) + '</span>' + chev + '</a>' +
      '<a class="c-merow" href="tel:' + p.phone.replace(/\s/g, '') + '" aria-label="Call ' + p.name + ', ' + p.phone + '">' + lead('phone') +
      '<span class="c-merow__main">' + p.phone + '</span>' + chev + '</a>';
    $('[data-maplink]').href = 'map.html?p=' + p.id;
    $('[data-share]').href = 'mailto:?subject=' + encodeURIComponent(p.name) +
      '&body=' + encodeURIComponent(p.name + ', ' + p.area + ', Subic Bay.');
    document.title = 'Subic.Life - ' + p.name;

    // Places you don't book show the card; bookable ones set their button above.
    if (!p.bookable) { action.textContent = 'Show my card'; action.href = 'card.html'; }

    var save = $('[data-save]');
    function paint(on) {
      save.classList.toggle('is-on', on);
      save.setAttribute('aria-pressed', on ? 'true' : 'false');
      save.firstChild.className = (on ? 'ph-fill' : 'ph-light') + ' ph-bookmark-simple';
    }
    paint(SLSaved.has('place', p.id));
    save.addEventListener('click', function () {
      var on = SLSaved.toggle('place', p.id);
      paint(on);
      SLSaved.note(on);
    });
  })();
</script>
</body>
</html>
