  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

<body>
<div class="phone is-pushed has-bottombar c-offerx c-offerwhite c-placewhite c-placeclean c-pwa c-bkv-b">

  <header class="c-statusbar is-overlay">
    <span>9:41</span>
    <span class="c-statusbar__icons">
      <span class="material-symbols-outlined">signal_cellular_alt</span>
      <span class="material-symbols-outlined">wifi</span>
      <span class="material-symbols-outlined">battery_full</span>
    </span>
  </header>

  <div class="c-xbar" aria-hidden="true"><a class="c-xbar__back" href="explore.html" data-back tabindex="-1"><i class="ph-light ph-caret-left" aria-hidden="true"></i></a><span class="c-xbar__title is-small" data-barname></span><span style="width:32px"></span></div>

  <main class="screen-scroll">

    <div class="c-placehero">
      <div class="c-placehero__track" data-gallery data-snap></div>
      <span class="c-placehero__count" data-count></span>
      <div class="c-placehero__bar">
        <a class="c-circle-btn" href="explore.html" data-back aria-label="Back to Explore"><i class="ph-light ph-caret-left" aria-hidden="true"></i></a>
        <div class="c-placehero__right">
          <button class="c-circle-btn" type="button" aria-pressed="false" aria-label="Save place" data-save><i class="ph-light ph-heart" aria-hidden="true"></i></button>
          <a class="c-circle-btn" data-share href="mailto:" aria-label="Share place"><i class="ph-light ph-export" aria-hidden="true"></i></a>
        </div>
      </div>
    </div>

    <div class="c-offerbody">

      <div class="u-gutter c-offer-head">
        <h1 class="c-offer-title" data-name>Partner</h1>
        <p class="c-offer-tier" data-meta></p>
      </div>

      <div class="c-pperk" data-deal>
        <span class="c-minicard" aria-hidden="true"></span>
        <span class="c-pperk__text"><span class="c-pperk__title" data-otitle></span><span class="c-pperk__sub" data-osub></span></span>
      </div>

      <section class="c-osec">
        <h2 class="c-section-title">About</h2>
        <p class="c-pabout" data-about></p>
      </section>

      <section class="c-osec">
        <h2 class="c-section-title">Hours and location</h2>
        <a class="c-pmap" data-maplink href="map.html" aria-label="Show this place on the map">
          <span class="c-mapthumb__live" id="minimap"></span>
        </a>
        <div class="c-melist c-plinfo" data-info></div>
      </section>

      <section class="c-osec" data-has-sec hidden>
        <h2 class="c-section-title">What's here</h2>
        <div class="c-melist c-plhas" data-has></div>
      </section>

      <section class="c-osec" data-rooms-sec hidden>
        <h2 class="c-section-title" data-rooms-title>Rooms</h2>
        <div class="c-melist c-cgform c-plpick" data-pick hidden>
          <button class="c-merow c-bkpick" type="button" data-open="dates">
            <span class="c-merow__main">Dates<span class="c-merow__sub" data-nights hidden></span></span>
            <span class="c-merow__value c-bkval is-empty" data-range>Add dates</span>
            <i class="ph-light ph-caret-right c-merow__chev" aria-hidden="true"></i>
          </button>
          <button class="c-merow c-bkpick" type="button" data-open="guests">
            <span class="c-merow__main">Guests</span>
            <span class="c-merow__value c-bkval" data-party>2 adults</span>
            <i class="ph-light ph-caret-right c-merow__chev" aria-hidden="true"></i>
          </button>
        </div>
        <div class="c-melist c-plrooms" data-rooms></div>
      </section>

      <section class="c-osec" data-stories-sec hidden>
        <div class="c-plhead"><h2 class="c-section-title">Stories from members</h2><a class="c-cgsec__link" data-stories-all href="place-stories.html" hidden>See all</a></div>
        <p class="c-plrating" data-rating></p>
        <div class="c-plstories" data-stories></div>
      </section>
    </div>

  </main>

  <div class="c-bottombar">
    <div class="c-obar__price" data-barprice hidden></div>
    <a class="c-btn primary is-full" data-action href="book.html">Book</a>
  </div>

  <span class="c-homeindicator"></span>

</div>
<script src="data-a.js"></script>
<script src="data-e.js"></script>
<script src="members.js"></script>

<script src="saved.js"></script>
<script src="map-data.js"></script>
<script src="img/real/manifest.js"></script>
<script src="real-photos.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.js"></script>
<script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.0.22/leaflet-maplibre-gl.js"></script>
<script src="map-vector.js"></script>
<script>
  (function () {
    var p = placeFor(queryParam('p') || 'lighthouse');
    var $ = function (s) { return document.querySelector(s); };

    // Photo gallery: swipe through, with a "1 / 4" counter like Photos.
    var photos = p.photos || [p.hero];
    // A strong video opens the gallery; any other video comes right after the first photo.
    if (p.video) photos = p.videoFirst ? [p.video].concat(photos) : photos.slice(0, 1).concat([p.video], photos.slice(1));
    var gal = $('[data-gallery]'), count = $('[data-count]');
    gal.innerHTML = photos.map(function (src, i) {
      if (/\.mp4$/.test(src)) return '<video src="' + src + '" poster="' + p.poster + '" autoplay muted loop playsinline aria-label="' + p.name + ', video"></video>';
      return '<img src="' + src + '" alt="' + p.name + ', photo ' + (i + 1) + '"' + (i ? ' loading="lazy"' : '') + '>';
    }).join('');
    function syncCount() { count.textContent = (Math.round(gal.scrollLeft / gal.clientWidth) + 1) + ' / ' + photos.length; }
    count.hidden = photos.length < 2;
    gal.addEventListener('scroll', syncCount, { passive: true });
    document.querySelector('main').style.setProperty('--ph', 'url(' + (p.videoFirst ? p.poster : photos[0]) + ')');
    syncCount();
    $('[data-name]').textContent = p.name;
    $('[data-barname]').textContent = p.name;
    var phone = document.querySelector('.phone'), main = document.querySelector('main');
    main.addEventListener('scroll', function () { phone.classList.toggle('is-scrolled', main.scrollTop > 230); }, { passive: true });
    $('[data-meta]').textContent = p.category + ' · ' + p.area;
    if (p.per) {
      var lo = Math.min.apply(null, p.rooms.map(function (r) { return r.rate; }));
      // Charters by the hour quote the cheapest hour.
      var hourly = p.rooms.filter(function (r) { return r.perHour; });
      if (hourly.length) lo = Math.min.apply(null, hourly.map(function (r) { return r.perHour; }));
      $('[data-meta]').insertAdjacentHTML('afterend', '<p class="c-plede">From <b>' + fmtPeso(lo - Math.round(lo * p.discount / 100)) + '</b> / ' + (hourly.length ? 'hour' : p.per[0]) + (p.lede ? ' · ' + p.lede : '') + '</p>');
    }
    // Carousell-style: the price is the boldest line after the name. Lowest room after the member discount.
    if (!p.per && p.rooms && p.rooms.length) {
      var lr = Math.min.apply(null, p.rooms.map(function (r) { return r.rate; }));
      $('[data-meta]').insertAdjacentHTML('afterend', '<p class="c-plprice"><b>' + fmtPeso(lr - Math.round(lr * (p.discount || 0) / 100)) + '</b>' +
        '<span> / ' + (p.unit || 'night') + '</span>' + (p.discount ? '<s>' + fmtPeso(lr) + '</s>' : '') + '</p>');
    }
    // The member offer gets its own row under the name; the price waits in the bottom bar beside
    // the action, so each fact shows once.
    var offer = ((window.FEED && FEED.offers) || []).filter(function (o) { return o.place === p.id; })[0];
    var deal = $('[data-deal]');
    if (offer) {
      $('[data-otitle]').textContent = offer.title;
      $('[data-osub]').textContent = 'Prestige perk · ' + (p.unit === 'night' ? 'includes 1 free night' : p.bookable ? 'applied when you book' : p.discount ? 'show your card to pay' : 'with any bill');
    } else {
      deal.hidden = true;
    }
    var member = function (rate) { return rate - Math.round(rate * p.discount / 100); };
    var action = $('[data-action]');
    if (p.bookable && p.kind === 'tickets') {
      // A day pass is like a zoo ticket: open daily, never sold out, so nothing to check. The listing lists the
      // tickets at member prices; tapping one opens what it includes, a row of days and how many, then Book.
      var tix = p.rooms, tf = SLStay.fmt, tsec = $('[data-rooms-sec]');
      var tstate = { day: tf.parse(queryParam('d')), time: queryParam('t') || '', adults: Number(queryParam('a')) || (p.per && !(tix[0] || {}).flat ? 1 : 2), kids: Number(queryParam('c')) || 0, hours: Number(queryParam('h')) || 0 };
      // A ticket can be priced by something other than people (Zoobic's family package is priced a package of 5), so its
      // own per wins. People and packages keep separate counts, so 2 adults don't turn into 2 packages.
      var perOf = function (t) { return t.per || p.per; }, kindOf = function (t) { return perOf(t) ? perOf(t)[0] : ''; };
      var tkind = kindOf(tix[Number(queryParam('room'))] || {}), tcounts = {};
      // No bottom bar: the tickets are the way in, and a bar pointing back at them would only repeat them.
      $('.c-bottombar').style.display = 'none';
      tsec.hidden = false;
      tsec.id = 'tickets';
      $('[data-rooms-title]').textContent = p.tixWord ? p.tixWord[0] : 'Tickets';
      var tprice = function (t) {
        // A charter is one price for the boat: by the hour (with its minimum) or for the night.
        if (t.perHour) return fmtPeso(member(t.perHour)) + '<span class="c-plroom__unit"> / hour · ' + t.minH + ' hours min</span> <s>' + fmtPeso(t.perHour) + '</s>';
        if (t.flat) return fmtPeso(member(t.rate)) + '<span class="c-plroom__unit"> / ' + (t.unit || 'trip') + '</span> <s>' + fmtPeso(t.rate) + '</s>';
        return t.child
          ? fmtPeso(member(t.rate)) + '<span class="c-plroom__unit"> adult · </span>' + fmtPeso(member(t.child)) + '<span class="c-plroom__unit"> child</span>'
          : fmtPeso(member(t.rate)) + '<span class="c-plroom__unit"> / ' + (perOf(t) ? perOf(t)[0] : 'person') + '</span> <s>' + fmtPeso(t.rate) + '</s>';
      };
      $('[data-rooms]').innerHTML = tix.map(function (t, i) {
        return '<button class="c-merow c-plroom c-pltix" type="button" data-tix="' + i + '">' +
          '<span class="c-merow__main"><span class="c-bkroom__name">' + t.name + '</span><span class="c-merow__sub">' + t.sub + '</span>' +
          '<span class="c-bkroom__price">' + tprice(t) + '</span></span>' +
          '<i class="ph-light ph-caret-right c-merow__chev" aria-hidden="true"></i></button>';
      }).join('');
      var phone = document.querySelector('.phone');
      phone.querySelector('.c-homeindicator').insertAdjacentHTML('beforebegin',
        '<div class="c-sheet c-bksheet c-tixsheet" data-tixsheet role="dialog" aria-modal="true" aria-labelledby="tix-title" hidden>' +
          '<button class="c-sheet__scrim" type="button" data-tixclose aria-label="Close"></button>' +
          '<div class="c-sheet__panel"><div class="c-sheet__grabber" aria-hidden="true"></div>' +
            '<div class="c-tixsheet__body" data-tixbody></div><div class="c-bksheet__foot" data-tixfoot></div></div>' +
        '</div>');
      var tsheet = $('[data-tixsheet]'), topen = -1, topener = null;
      var tlead = function (icon) { return '<span class="c-merow__lead"><i class="ph-light ph-' + icon + '" aria-hidden="true"></i></span>'; };
      var tlist = function (head, items, icon) {
        return items && items.length ? '<p class="c-mehead">' + head + '</p><div class="c-melist">' + items.map(function (x) {
          var r = Array.isArray(x) ? x : [icon, x];
          return '<div class="c-merow">' + tlead(r[0]) + '<span class="c-merow__main">' + r[1] + '</span></div>';
        }).join('') + '</div>' : '';
      };
      var tstep = function (key, label, sub, value, min, max) {
        return '<div class="c-merow"><span class="c-merow__main">' + label + '<span class="c-merow__sub">' + sub + '</span></span>' +
          '<span class="c-cgstep"><button class="c-cgstep__btn" type="button" data-tstep="' + key + '-1" aria-label="One fewer"' + (value <= min ? ' disabled' : '') + '><i class="ph-light ph-minus" aria-hidden="true"></i></button>' +
          '<span class="c-cgstep__value" aria-live="polite">' + value + '</span>' +
          '<button class="c-cgstep__btn" type="button" data-tstep="' + key + '1" aria-label="One more"' + ((max != null ? value >= max : tstate.adults + tstate.kids >= (tix[topen].max || 20)) ? ' disabled' : '') + '><i class="ph-light ph-plus" aria-hidden="true"></i></button></span></div>';
      };
      // The day comes from one month at a time (SLStay.month), opening on the picked day's month.
      var monthOf = function (x) { return new Date(x.getFullYear(), x.getMonth(), 1); };
      var tview = monthOf(tstate.day || SLStay.today);
      var drawSheet = function () {
        var t = tix[topen], s = tstate, d = s.day, ppl = s.adults + s.kids, per = perOf(t);
        // A ticket that must be bought ahead (t.ahead days) can't be picked for today.
        var from = tf.add(SLStay.today, t.ahead || 0);
        if (d && d < from) s.day = d = null;
        // Lessons with start times ask for one before Book.
        var sl = t.slots, tm = sl && sl.indexOf(s.time) > -1 ? s.time : '';
        // A charter by the hour: from the boat's minimum up to the 6 PM return (p.gate[1]) after the start picked.
        var back = Number(p.gate[1]), hmax = t.perHour ? back - Number((tm || sl[0]).slice(0, 2)) : 0;
        if (t.perHour) charterFor(t, s.hours = Math.min(hmax, Math.max(t.minH, s.hours || t.minH)));
        if (t.max && ppl > t.max) { s.adults = ppl = t.max; s.kids = 0; }
        var total = t.flat ? member(t.rate) : t.child ? member(t.rate) * s.adults + member(t.child) * s.kids : member(t.rate) * ppl;
        // Redrawing keeps the sheet's scroll and the day row's scroll where they were.
        var body = $('[data-tixbody]'), top0 = body.scrollTop;
        body.innerHTML =
          '<div class="c-bksheet__head"><h2 class="c-bksheet__title" id="tix-title">' + t.name + '</h2><p class="c-bksheet__sub">' + t.sub + '</p></div>' +
          // The rules that decide a purchase, before the price: the park store's own terms.
          '<ul class="c-tixfacts">' + (t.facts || p.tixFacts).map(function (f) {
            return '<li><i class="ph-light ph-' + f[0] + '" aria-hidden="true"></i>' + f[1] + '</li>';
          }).join('') + '</ul>' +
          tlist('Includes', t.incl, 'check') + tlist('Good to know', (t.know || []).concat(p.ticketNote || []), 'info') +
          '<p class="c-mehead">When are you going?</p><div class="c-tixcal">' + SLStay.month(tview, d, from) + '</div>' +
          (sl ? '<p class="c-mehead">What time?</p><div class="c-tixslots">' + sl.map(function (x) {
              return '<button class="c-tixslot" type="button" data-slot="' + x + '" aria-pressed="' + (x === tm) + '">' +
                fmtClock(x) + '<span>to ' + fmtClock(x, t.perHour ? Math.min(t.hours, back - Number(x.slice(0, 2))) : t.hours) + '</span></button>';
            }).join('') + '</div>' : '') +
          (t.perHour ? '<p class="c-mehead">How long?</p><div class="c-melist c-cgform">' +
            tstep('h', 'Hours', t.minH + ' hours minimum, back by ' + fmtClock(p.gate[1] + '00'), s.hours, t.minH, hmax) + '</div>' : '') +
          '<p class="c-mehead">How many?</p><div class="c-melist c-cgform">' +
            (t.child
              ? tstep('a', 'Adults', p.ages[0], s.adults, 1) + tstep('c', 'Children', p.ages[1], s.kids, 0)
              : tstep('g', per ? per[2] : 'Guests', t.who || 'Per person', ppl, 1)) +
          '</div>';
        body.scrollTop = top0;
        var who = (t.perHour ? tf.plural(s.hours, 'hour', 'hours') + ' · ' : '') + (t.child ? tf.party(s.adults, s.kids) : tf.plural(ppl, per ? per[0] : 'guest', per ? per[1] : 'guests'));
        var ready = d && (!sl || tm);
        var go = ready ? 'book.html?p=' + p.id + '&room=' + topen + '&d=' + tf.iso(d) + '&a=' + (t.child ? s.adults : ppl) + '&c=' + (t.child ? s.kids : 0) +
          (tm ? '&t=' + tm : '') + (t.perHour ? '&h=' + s.hours : '') : '';
        $('[data-tixfoot]').innerHTML =
          '<span class="c-bkbar__sum"><b>' + fmtPeso(total) + '</b><span>' + (d ? tf.day(d) + (tm ? ', ' + fmtClock(tm) : '') + ' · ' : '') + who + '</span></span>' +
          (ready ? '<a class="c-btn primary" href="' + go.replace(/&/g, '&amp;') + '">Book</a>'
             : '<span class="c-btn primary" aria-disabled="true">' + (d ? 'Pick a time' : 'Pick a day') + '</span>');
      };
      var closeTix = function () { tsheet.hidden = true; if (topener) topener.focus(); };
      $('[data-rooms]').addEventListener('click', function (e) {
        var b = e.target.closest('[data-tix]');
        if (!b) return;
        topen = Number(b.dataset.tix); topener = b;
        var k = kindOf(tix[topen]);
        if (k !== tkind) {
          tcounts[tkind] = [tstate.adults, tstate.kids];
          var c = tcounts[k] || [k && k !== 'person' ? 1 : 2, 0];
          tstate.adults = c[0]; tstate.kids = c[1]; tkind = k;
        }
        drawSheet();
        tsheet.hidden = false;
        $('[data-tixbody]').scrollTop = 0;
        tsheet.querySelector('#tix-title').focus();
      });
      tsheet.addEventListener('click', function (e) {
        if (e.target.closest('[data-tixclose]')) return closeTix();
        var day = e.target.closest('[data-day]');
        if (day) {
          if (!day.disabled) { tstate.day = tf.parse(day.dataset.day); drawSheet(); }
          var day2 = tsheet.querySelector('[data-day="' + day.dataset.day + '"]');
          if (day2) day2.focus();
          return;
        }
        var slot = e.target.closest('[data-slot]');
        if (slot) {
          tstate.time = slot.dataset.slot;
          drawSheet();
          tsheet.querySelector('[data-slot="' + slot.dataset.slot + '"]').focus();
          return;
        }
        var nv = e.target.closest('[data-mnav]');
        if (nv) {
          tview = new Date(tview.getFullYear(), tview.getMonth() + Number(nv.dataset.mnav), 1);
          drawSheet();
          var nv2 = tsheet.querySelector('[data-mnav="' + nv.dataset.mnav + '"]');
          if (nv2 && !nv2.disabled) nv2.focus();
          return;
        }
        var st = e.target.closest('[data-tstep]');
        if (st) {
          var k = st.dataset.tstep[0], step = st.dataset.tstep.slice(1) === '1' ? 1 : -1;
          if (k === 'h') tstate.hours += step;
          else if (k === 'a') tstate.adults += step;
          else if (k === 'c') tstate.kids += step;
          else { tstate.adults = tstate.adults + tstate.kids + step; tstate.kids = 0; }
          drawSheet();
          var again = tsheet.querySelector('[data-tstep="' + st.dataset.tstep + '"]');
          if (again && !again.disabled) again.focus();
        }
      });
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && !tsheet.hidden) closeTix();
      });
      // Change on Confirm and pay comes back here, at the tickets.
      if (location.hash === '#tickets') setTimeout(function () { $('.screen-scroll').scrollTop = tsec.offsetTop - 60; }, 0);
    } else if (p.bookable) {
      // Stays check availability first, like Airbnb: Dates and Guests rows over the rooms open the same sheets as
      // Confirm and pay. Until there are dates, the bar quotes the cheapest room a night and its button opens the
      // calendar; with dates, every price is for the whole stay and the button reserves the cheapest room that fits.
      var rooms = p.rooms || [];
      var bar = $('[data-barprice]');
      bar.hidden = false;
      action.classList.remove('is-full');
      $('[data-rooms-sec]').hidden = !rooms.length;
      $('[data-rooms-title]').textContent = p.unit === 'night' ? 'Rooms' : 'Tours';
      var order = rooms.map(function (r, i) { return i; }).sort(function (a, b) { return rooms[a].rate - rooms[b].rate; });
      var sleeps = rooms.map(function (r) { var m = /sleeps (\d+)/.exec(r.sub); return r.sleeps || (m ? Number(m[1]) : 2); });
      var f = window.SLStay && SLStay.fmt;
      var picker = p.unit === 'night' && rooms.length && f && SLStay({
        checkIn: f.parse(queryParam('in')), checkOut: f.parse(queryParam('out')),
        adults: Number(queryParam('a')) || 2, kids: Number(queryParam('c')) || 0,
        maxParty: Math.max.apply(null, sleeps), optional: true, onChange: function () { draw(); }
      });
      $('[data-pick]').hidden = true;
      if (picker) $('.c-bottombar').style.display = 'none';
      var draw = function () {
        var s = picker ? picker.state : null;
        var n = s && s.checkOut ? f.nights(s.checkIn, s.checkOut) : 0;

      var real = window.REAL && window.REAL[p.id], src = (real && real.photos && real.photos[0]) || p.hero;
      var sub = head.querySelector('.c-bksheet__sub');
      var area = sub ? sub.textContent.split(' · ').slice(1).join(' · ') : '';
      head.outerHTML = '<div class="c-pv2__shero"><img src="' + src + '" alt="">' + (p.offerShort ? '<span class="c-pv2__tag">' + esc(p.offerShort) + '</span>' : '') + '</div>' +
        '<div class="c-pv2__shead"><h2 class="c-bksheet__title" id="tbl-title">' + esc(p.name) + '</h2><p class="c-pv2__rfacts">Reserve a table' + (area ? ' · ' + esc(area) : '') + '</p></div>';
      tbody.closest('.c-sheet').classList.add('c-pv2__sheet', 'c-pv2__tsheet');
    }).observe(tbody, { childList: true });
    // Reserve bar: when the big line on the left says the same as the button ("Pick a day" twice), show the party size there instead.
    var tfoot = tbody && tbody.closest('.c-sheet').querySelector('.c-bksheet__foot');
    if (tfoot) {
      var fixFoot = function () {
        var btn = tfoot.querySelector('.c-btn'), left = tfoot.querySelector('.c-bkbar__sum');
        var big = left && left.firstElementChild, small = big && big.nextElementSibling;
        if (!btn || !big || big === btn || !small) return;
        if (big.textContent.trim() === btn.textContent.trim() && big.textContent !== small.textContent) { big.textContent = small.textContent; small.textContent = ''; }
      };
      new MutationObserver(fixFoot).observe(tfoot, { childList: true, subtree: true, characterData: true });
    }
    // The member offer as an orange tag on each card photo, same as the Discover cards.
    if (p.offerShort && phone.classList.contains('c-pv2--rooms')) document.querySelectorAll('.c-plrooms .c-plroom').forEach(function (c) {
      if (c.querySelector('.c-bkroom__img')) c.insertAdjacentHTML('beforeend', '<span class="c-pv2__tag">' + esc(p.offerShort) + '</span>');
    });
  })();
</script>
</body>
</html>
