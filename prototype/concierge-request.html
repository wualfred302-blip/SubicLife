<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFFFFF">
  <title>Subic.Life - Request</title><link rel="icon" href="img/icon.svg" type="image/svg+xml"><link rel="icon" href="img/favicon-32.png" sizes="32x32"><link rel="apple-touch-icon" href="img/apple-touch-icon.png"><link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/light/style.css" rel="stylesheet">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="components.css">
  <link rel="stylesheet" href="components-c.css">
  <link rel="stylesheet" href="components-g.css">
  <link rel="stylesheet" href="screen.css">
  <link rel="stylesheet" href="shell.css">
  <link rel="stylesheet" href="theme.css">
  <script src="shell.js"></script>
</head>
<body>
<div class="phone c-push c-discover c-cgpage c-cgreq">

  <header class="c-statusbar">
    <span>9:41</span>
    <span class="c-statusbar__icons">
      <span class="material-symbols-outlined">signal_cellular_alt</span>
      <span class="material-symbols-outlined">wifi</span>
      <span class="material-symbols-outlined">battery_full</span>
    </span>
  </header>

  <div class="c-dhead c-dhead--push">
    <a class="c-dhead__back" href="concierge.html" data-back aria-label="Back to Concierge"><i class="ph-light ph-caret-left" aria-hidden="true"></i></a>
    <h1 class="c-dhead__title" id="nav-title">Request</h1>
    <span class="c-dhead__spacer" aria-hidden="true"></span>
  </div>

  <main class="screen-scroll">

    <img class="c-cgreq__hero" id="hero" src="img/card-lighthouse.jpg" alt="">

    <div class="c-cgreq__head">
      <h2 class="c-cgreq__title" id="title">Request</h2>
      <p class="c-cgreq__desc" id="desc"></p>
      <p class="c-cgreq__price" id="price"></p>
    </div>

    <div class="c-melist c-cgform">
      <label class="c-merow">
        <span class="c-merow__main">Date</span>
        <span class="c-merow__value" id="date-out">Sat 17 Oct</span>
        <i class="ph-light ph-caret-right c-merow__chev" aria-hidden="true"></i>
        <input class="c-group__input" id="date" type="date" value="2026-10-17" min="2026-10-12" aria-label="Date">
      </label>
      <label class="c-merow">
        <span class="c-merow__main">Time</span>
        <span class="c-merow__value" id="time-out">10:00 AM</span>
        <i class="ph-light ph-caret-right c-merow__chev" aria-hidden="true"></i>
        <input class="c-group__input" id="time" type="time" value="10:00" aria-label="Time">
      </label>
      <div class="c-merow">
        <span class="c-merow__main">Guests</span>
        <span class="c-cgstep">
          <button class="c-cgstep__btn" type="button" id="g-minus" aria-label="Fewer guests"><i class="ph-light ph-minus" aria-hidden="true"></i></button>
          <span class="c-cgstep__value" id="g-val" aria-live="polite">6</span>
          <button class="c-cgstep__btn" type="button" id="g-plus" aria-label="More guests"><i class="ph-light ph-plus" aria-hidden="true"></i></button>
        </span>
      </div>
    </div>

    <p class="c-mehead">Notes for Mika</p>
    <textarea class="c-cgnotes" id="note" rows="3" placeholder="Pickup point, flight number, dietary needs" aria-label="Notes for Mika"></textarea>

    <p class="c-cgreq__note">Mika replies in about 5 minutes.</p>

  </main>

  <div class="c-req-bar">
    <a class="c-btn primary" id="send" href="concierge-chat.html">Send request</a>
  </div>

  <span class="c-homeindicator"></span>

</div>
<script src="data-g.js"></script>
<script src="img/real/manifest.js"></script>
<script src="real-photos.js"></script>
<script>
(function () {
  var C = window.CONCIERGE;
  var params = new URLSearchParams(window.location.search);
  var type = C.EXPERIENCES[params.get('type')] ? params.get('type') : 'yacht';
  var e = C.EXPERIENCES[type];

  function $(id) { return document.getElementById(id); }

  document.title = 'Subic.Life - ' + e.title;
  $('nav-title').textContent = e.title;
  $('hero').src = e.img;
  $('hero').alt = e.title;
  $('title').textContent = e.title;
  $('desc').textContent = e.desc;
  $('price').textContent = 'From ' + C.peso(e.price) + (e.priceNote ? ' ' + e.priceNote : '') + ' · Prestige price';

  var dateIn = $('date'), timeIn = $('time'), note = $('note'), send = $('send');
  var minus = $('g-minus'), plus = $('g-plus'), gVal = $('g-val');
  var guests = e.guests;

  dateIn.value = '2026-10-17';
  timeIn.value = e.time;

  function sync() {
    $('date-out').textContent = C.fmtDate(dateIn.value);
    $('time-out').textContent = C.fmtTime(timeIn.value);
    gVal.textContent = guests;
    minus.disabled = guests <= 1;
    plus.disabled = guests >= e.max;
    var p = new URLSearchParams({
      topic: type,
      from: 'request',
      date: dateIn.value,
      time: timeIn.value,
      guests: String(guests),
      note: note.value.trim()
    });
    send.setAttribute('href', 'concierge-chat.html?' + p.toString());
  }

  minus.addEventListener('click', function () { guests = Math.max(1, guests - 1); sync(); });
  plus.addEventListener('click', function () { guests = Math.min(e.max, guests + 1); sync(); });
  dateIn.addEventListener('input', sync);
  timeIn.addEventListener('input', sync);
  note.addEventListener('input', sync);
  sync();
})();
</script>
</body>
</html>
