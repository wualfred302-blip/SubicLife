<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFFFFF">
  <title>Subic.Life - Request</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="components.css">
  <link rel="stylesheet" href="components-c.css">
  <link rel="stylesheet" href="components-g.css">
  <link rel="stylesheet" href="screen.css">
  <link rel="stylesheet" href="shell.css">
  <link rel="stylesheet" href="theme.css">
  <script src="shell.js"></script>
</head>
<body>
<div class="phone c-push">

  <header class="c-statusbar">
    <span>9:41</span>
    <span class="c-statusbar__icons">
      <span class="material-symbols-outlined">signal_cellular_alt</span>
      <span class="material-symbols-outlined">wifi</span>
      <span class="material-symbols-outlined">battery_full</span>
    </span>
  </header>

  <nav class="c-navbar">
    <a data-back class="c-navbar__back" href="concierge.html" aria-label="Back to Concierge">
      <svg class="c-navbar__chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="M15.75 19.5L8.25 12l7.5-7.5"/></svg>
    </a>
    <div class="c-navbar__titles">
      <h1 class="c-navbar__title" id="nav-title">Request</h1>
    </div>
    <span></span>
  </nav>

  <main class="screen-scroll c-g-pushed">

    <figure class="c-req-hero u-mb-0">
      <img id="hero" src="img/card-lighthouse.jpg" alt="">
    </figure>

    <div class="u-gutter">
      <h1 class="c-req-title" id="title">Request</h1>
      <p class="c-req-desc" id="desc"></p>
      <p class="c-req-price" id="price"></p>

      <div class="c-group">
        <label class="c-group__row">
          <span class="c-group__label">Date</span>
          <span class="c-group__pick">
            <span class="c-group__value" id="date-out">Sat 17 Oct</span>
            <span class="material-symbols-outlined c-group__chev" aria-hidden="true">chevron_right</span>
            <input class="c-group__input" id="date" type="date" value="2026-10-17" min="2026-10-12" aria-label="Date">
          </span>
        </label>
        <label class="c-group__row">
          <span class="c-group__label">Time</span>
          <span class="c-group__pick">
            <span class="c-group__value" id="time-out">10:00 AM</span>
            <span class="material-symbols-outlined c-group__chev" aria-hidden="true">chevron_right</span>
            <input class="c-group__input" id="time" type="time" value="10:00" aria-label="Time">
          </span>
        </label>
        <div class="c-group__row">
          <span class="c-group__label">Guests</span>
          <span class="c-stepper">
            <button class="c-stepper__btn" type="button" id="g-minus" aria-label="Fewer guests"><span class="material-symbols-outlined">remove</span></button>
            <span class="c-stepper__value" id="g-val" aria-live="polite">6</span>
            <button class="c-stepper__btn" type="button" id="g-plus" aria-label="More guests"><span class="material-symbols-outlined">add</span></button>
          </span>
        </div>
      </div>

      <p class="c-group-head">Notes for Mika</p>
      <div class="c-group">
        <textarea class="c-group__notes" id="note" rows="3" placeholder="Pickup point, flight number, dietary needs" aria-label="Notes for Mika"></textarea>
      </div>

      <p class="c-req-note">Mika replies in about 5 minutes.</p>
    </div>

  </main>

  <div class="c-req-bar">
    <a class="c-btn primary" id="send" href="concierge-chat.html">Send request</a>
  </div>

  <span class="c-homeindicator"></span>

</div>
<script src="data-g.js"></script>
<script>
(function () {
  var C = window.CONCIERGE;
  var params = new URLSearchParams(window.location.search);
  var type = C.EXPERIENCES[params.get('type')] ? params.get('type') : 'yacht';
  var e = C.EXPERIENCES[type];

  function $(id) { return document.getElementById(id); }

  document.title = 'Subic.Life - ' + e.title;
  $('nav-title').textContent = e.title;
  $('hero').src = e.img;
  $('hero').alt = e.title;
  $('title').textContent = e.title;
  $('desc').textContent = e.desc;
  $('price').textContent = 'From ' + C.peso(e.price) + (e.priceNote ? ' ' + e.priceNote : '') + ' · Prestige price';

  var dateIn = $('date'), timeIn = $('time'), note = $('note'), send = $('send');
  var minus = $('g-minus'), plus = $('g-plus'), gVal = $('g-val');
  var guests = e.guests;

  dateIn.value = '2026-10-17';
  timeIn.value = e.time;

  function sync() {
    $('date-out').textContent = C.fmtDate(dateIn.value);
    $('time-out').textContent = C.fmtTime(timeIn.value);
    gVal.textContent = guests;
    minus.disabled = guests <= 1;
    plus.disabled = guests >= e.max;
    var p = new URLSearchParams({
      topic: type,
      from: 'request',
      date: dateIn.value,
      time: timeIn.value,
      guests: String(guests),
      note: note.value.trim()
    });
    send.setAttribute('href', 'concierge-chat.html?' + p.toString());
  }

  minus.addEventListener('click', function () { guests = Math.max(1, guests - 1); sync(); });
  plus.addEventListener('click', function () { guests = Math.min(e.max, guests + 1); sync(); });
  dateIn.addEventListener('input', sync);
  timeIn.addEventListener('input', sync);
  note.addEventListener('input', sync);
  sync();
})();
</script>
</body>
</html>
