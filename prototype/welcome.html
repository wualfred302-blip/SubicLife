<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Subic.Life - Welcome</title><link rel="icon" href="img/icon.svg" type="image/svg+xml"><link rel="icon" href="img/favicon-32.png" sizes="32x32"><link rel="apple-touch-icon" href="img/apple-touch-icon.png"><link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="components.css">
  <link rel="stylesheet" href="components-c.css">
  <link rel="stylesheet" href="screen.css">
  <link rel="stylesheet" href="shell.css">
  <link rel="stylesheet" href="theme.css">
  <script src="shell.js"></script>
</head>
<body>
<div class="phone theme-night c-welcome">

  <img class="c-welcome__photo" src="img/pass-subic-bay.jpg" alt="">
  <video class="c-welcome__photo c-welcome__video" src="img/real/welcome-montage.mp4" poster="img/pass-subic-bay.jpg" autoplay muted loop playsinline onplaying="this.classList.add('is-playing')"
    aria-hidden="true" onerror="this.remove()"></video>
  <div class="c-welcome__wash" aria-hidden="true"></div>

  <header class="c-statusbar c-statusbar--clear">
    <span>9:41</span>
    <span class="c-statusbar__icons">
      <span class="material-symbols-outlined">signal_cellular_alt</span>
      <span class="material-symbols-outlined">wifi</span>
      <span class="material-symbols-outlined">battery_full</span>
    </span>
  </header>

  <div class="c-welcome__body">
    <img class="c-wordmark c-logo c-welcome__mark c-welcome__mark--big" src="img/logo.svg" alt="Subic.Life">

    <div>
      <h1 class="c-welcome__title"><span class="c-welcome__place">Subic Bay</span><span class="c-welcome__for">For Exclusive Members</span></h1>
      <div class="c-welcome__actions">
        <a class="c-btn primary" href="join.html">Get started</a>
        <a class="c-btn plain" href="signin.html">I have an account</a>
      </div>
    </div>
  </div>

  <span class="c-homeindicator"></span>

</div>
<script src="app.js"></script>
<script>
  window.addEventListener('load', function () {
    setTimeout(function () { document.querySelector('.c-welcome__mark--big').classList.add('is-in'); }, 300);
  });
</script>
<script src="img/real/manifest.js"></script>
<script src="real-photos.js"></script>
</body>
</html>
