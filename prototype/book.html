<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Subic.Life - Confirm and pay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/light/style.css" rel="stylesheet">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="components.css">
  <link rel="stylesheet" href="screen.css">
  <link rel="stylesheet" href="components-a.css">
  <link rel="stylesheet" href="components-g.css">
  <link rel="stylesheet" href="shell.css">
  <link rel="stylesheet" href="theme.css">
  <script src="shell.js"></script>
</head>
<body>
<div class="phone c-push c-discover c-cgpage c-bkpage">

  <header class="c-statusbar">
    <span>9:41</span>
    <span class="c-statusbar__icons">
      <span class="material-symbols-outlined">signal_cellular_alt</span>
      <span class="material-symbols-outlined">wifi</span>
      <span class="material-symbols-outlined">battery_full</span>
    </span>
  </header>

  <div class="c-dhead c-dhead--push">
    <a class="c-dhead__back" data-back href="place.html?p=lighthouse" aria-label="Back to the partner page"><i class="ph-light ph-caret-left" aria-hidden="true"></i></a>
    <h1 class="c-dhead__title">Confirm and pay</h1>
    <span class="c-dhead__spacer" aria-hidden="true"></span>
  </div>

  <main class="screen-scroll">

    <div class="c-bkplace">
      <img class="c-bkplace__img" data-thumb src="img/card-lighthouse.jpg" alt="">
      <span class="c-bkplace__text"><span class="c-bkplace__name" data-name>Partner</span><span class="c-bkplace__sub" data-area></span></span>
    </div>

    <div class="c-melist c-cgform" data-stay-form hidden>
      <button class="c-merow c-bkpick" type="button" data-open="dates">
        <span class="c-merow__main">Dates<span class="c-merow__sub" data-nights>2 nights</span></span>
        <span class="c-merow__value c-bkval" data-range>Fri 23 – Sun 25 Oct</span>
        <i class="ph-light ph-caret-right c-merow__chev" aria-hidden="true"></i>
      </button>
      <button class="c-merow c-bkpick" type="button" data-open="guests">
        <span class="c-merow__main">Guests</span>
        <span class="c-merow__value c-bkval" data-party>2 adults</span>
        <i class="ph-light ph-caret-right c-merow__chev" aria-hidden="true"></i>
      </button>
    </div>
    <p class="c-bknote" data-times hidden>Check-in from 2 PM · check-out by 12 PM</p>

    <div class="c-melist c-cgform" data-trip-form hidden>
      <div class="c-merow">
        <span class="c-merow__main" data-in-label>Check-in</span>
        <span class="c-merow__value c-bkval" data-in-value>Sat, 17 Oct</span>
      </div>
      <div class="c-merow">
        <span class="c-merow__main" data-out-label>Check-out</span>
        <span class="c-merow__value c-bkval" data-out-value>Sun, 18 Oct</span>
      </div>
      <div class="c-merow">
        <span class="c-merow__main">Guests</span>
        <span class="c-cgstep">
          <button class="c-cgstep__btn" type="button" data-step="-1" aria-label="Remove a guest"><i class="ph-light ph-minus" aria-hidden="true"></i></button>
          <span class="c-cgstep__value" data-guests aria-live="polite">2</span>
          <button class="c-cgstep__btn" type="button" data-step="1" aria-label="Add a guest"><i class="ph-light ph-plus" aria-hidden="true"></i></button>
        </span>
      </div>
    </div>

    <p class="c-mehead" data-room-head>Room</p>
    <div class="c-melist c-bklist" data-rooms role="radiogroup"></div>

    <div data-perk hidden>
      <p class="c-mehead">Prestige perk</p>
      <div class="c-melist c-cgform">
        <label class="c-merow c-bkperk">
          <span class="c-merow__main">Use your free night<span class="c-merow__sub">Prestige includes 1 free night</span></span>
          <input class="c-switch" type="checkbox" data-free checked>
        </label>
      </div>
    </div>

    <p class="c-mehead">Price</p>
    <div class="c-melist c-bkprice">
      <div class="c-bkprice__row"><span data-line>Room</span><span data-rack>₱0</span></div>
      <div class="c-bkprice__row is-save"><span data-disc-label>Prestige discount</span><span data-disc>−₱0</span></div>
      <div class="c-bkprice__row is-save" data-free-row hidden><span>Free night</span><span data-free-amt>−₱0</span></div>
      <div class="c-bkprice__row is-total"><span>Total</span><span data-total>₱0</span></div>
    </div>
    <p class="c-bknote" data-cancel hidden></p>

    <div data-req hidden>
      <p class="c-mehead">Requests</p>
      <div class="c-melist"><textarea class="c-bkreq" data-reqtext rows="3" maxlength="300" placeholder="Arrival time, bed setup, anything the hotel should know (optional)" aria-label="Requests for the hotel"></textarea></div>
    </div>

    <p class="c-mehead">Payment</p>
    <div class="c-melist c-bklist">
      <a class="c-merow" href="me-payment-methods.html">
        <span class="c-merow__lead"><i class="ph-light ph-wallet" aria-hidden="true"></i></span>
        <span class="c-merow__main">GCash</span>
        <span class="c-merow__value">Change</span>
        <i class="ph-light ph-caret-right c-merow__chev" aria-hidden="true"></i>
      </a>
    </div>

  </main>

  <div class="c-req-bar">
    <span class="c-bkbar__sum" data-bar-sum hidden><b data-bar-total>₱0</b><span data-bar-nights>Total</span></span>
    <a class="c-btn primary" data-pay href="book-done.html">Pay</a>
  </div>

  <span class="c-homeindicator"></span>

</div>
<script src="data-a.js"></script>
<script src="stay.js"></script>
<script>
  (function () {
    var p = placeFor(queryParam('p') || 'lighthouse');
    if (!p.bookable) {
      location.replace('place.html?p=' + p.id);
      return;
    }
    var $ = function (s) { return document.querySelector(s); };
    var $$ = function (s) { return Array.prototype.slice.call(document.querySelectorAll(s)); };
    var stay = p.unit === 'night';
    var member = function (rate) { return rate - Math.round(rate * p.discount / 100); };

    document.title = 'Subic.Life - Confirm and pay, ' + p.name;
    $('[data-name]').textContent = p.name;
    $('[data-thumb]').src = p.thumb;
    $('[data-area]').textContent = p.category + ' · ' + p.area;
    $('[data-back]').href = 'place.html?p=' + p.id;
    $('[data-room-head]').textContent = stay ? 'Room' : 'Trip';
    $('[data-disc-label]').textContent = 'Prestige ' + p.discount + '% off';

    // Each room with its photo and the member price, the same price the partner page quotes. A tick marks the pick.
    var pick = Math.min(Number(queryParam('room')) || 0, p.rooms.length - 1);
    var sleeps = p.rooms.map(function (r) { var m = /sleeps (\d+)/.exec(r.sub); return m ? Number(m[1]) : 99; });
    $('[data-rooms]').innerHTML = p.rooms.map(function (r, i) {
      return '<label class="c-merow c-bkroom">' +
        '<input class="c-bkroom__input" type="radio" name="room" value="' + i + '"' + (i === pick ? ' checked' : '') + '>' +
        '<img class="c-bkroom__img" src="' + (r.photo || p.thumb) + '" alt="">' +
        '<span class="c-merow__main"><span class="c-bkroom__name">' + r.name + '</span><span class="c-merow__sub">' + r.sub + '</span>' +
        '<span class="c-bkroom__price">' + fmtPeso(member(r.rate)) + ' <s>' + fmtPeso(r.rate) + '</s></span></span>' +
        '<i class="ph-light ph-check c-bkroom__tick" aria-hidden="true"></i>' +
      '</label>';
    }).join('');
    var room = function () { return Number(document.querySelector('input[name="room"]:checked').value); };

    if (p.kind === 'tickets') {
      // Tickets: the day and how many can still change here; the ticket itself changes on the listing.
      $$('[data-stay-form], [data-bar-sum], [data-cancel]').forEach(function (e) { e.hidden = false; });
      $('.c-req-bar').classList.add('is-stay');
      $('[data-stay-form] [data-open="dates"] .c-merow__main').firstChild.textContent = 'Date';
      $('[data-room-head]').textContent = 'Ticket';
      $('[data-room-head]').insertAdjacentHTML('beforeend', '<a class="c-bkchange" data-tixchange href="place.html?p=' + p.id + '#tickets">Change</a>');
      $$('.c-bkroom__price').forEach(function (el, i) {
        var t = p.rooms[i];
        el.innerHTML = t.child
          ? fmtPeso(member(t.rate)) + ' adult · ' + fmtPeso(member(t.child)) + ' child'
          : fmtPeso(member(t.rate)) + ' / person <s>' + fmtPeso(t.rate) + '</s>';
      });
      $$('.c-bkroom__img, .c-bkroom__tick').forEach(function (x) { x.remove(); });
      $$('.c-bkroom').forEach(function (row, i) { row.hidden = i !== pick; });
      $('.c-bkprice .c-bkprice__row').insertAdjacentHTML('afterend', '<div class="c-bkprice__row" data-kidline hidden><span data-kidlabel></span><span data-kidamt></span></div>');
      var tf = SLStay.fmt;
      var tk = SLStay({
        single: true, checkIn: tf.parse(queryParam('d')) || tf.add(SLStay.today, 1),
        adults: Number(queryParam('a')) || 2, kids: Number(queryParam('c')) || 0, maxParty: 20, guestNote: '',
        onChange: function () { renderTix(); }
      });
      var renderTix = function () {
        var s = tk.state, i = room(), t = p.rooms[i], kid = t.child || t.rate;
        var full = t.rate * s.adults + kid * s.kids, total = member(t.rate) * s.adults + member(kid) * s.kids;
        var q = '&d=' + tf.iso(s.checkIn) + '&a=' + s.adults + '&c=' + s.kids;
        $('[data-range]').textContent = tf.day(s.checkIn);
        $('[data-nights]').hidden = true;
        $('[data-party]').textContent = tf.party(s.adults, s.kids);
        $('[data-line]').textContent = fmtPeso(t.rate) + ' × ' + tf.plural(s.adults, 'adult', 'adults');
        $('[data-rack]').textContent = fmtPeso(t.rate * s.adults);
        $('[data-kidline]').hidden = !s.kids;
        $('[data-kidlabel]').textContent = fmtPeso(kid) + ' × ' + tf.plural(s.kids, 'child', 'children');
        $('[data-kidamt]').textContent = fmtPeso(kid * s.kids);
        $('[data-disc]').textContent = '−' + fmtPeso(full - total);
        $('[data-total]').textContent = fmtPeso(total);
        // The park store's own terms.
        $('[data-cancel]').textContent = 'Valid only on ' + tf.day(s.checkIn) + '. ' + p.ticketTerms;
        $('[data-bar-total]').textContent = fmtPeso(total);
        $('[data-bar-nights]').textContent = tf.day(s.checkIn);
        $('[data-pay]').textContent = 'Pay';
        $('[data-pay]').href = 'book-done.html?p=' + p.id + '&room=' + i + q;
        $('[data-tixchange]').href = 'place.html?p=' + p.id + q + '#tickets';
      };
      renderTix();
      return;
    }

    if (!stay) {
      // Trips keep the simple form: one date, a start time and a guest count.
      $('[data-trip-form]').hidden = false;
      $('[data-in-label]').textContent = p.dates[0];
      $('[data-out-label]').textContent = p.dates[1];
      $('[data-in-value]').textContent = p.dates[2];
      $('[data-out-value]').textContent = p.dates[3];
      var guests = 2;
      var renderTrip = function () {
        var i = room(), r = p.rooms[i], off = Math.round(r.rate * p.discount / 100), total = r.rate - off;
        $('[data-line]').textContent = r.name + ', 1 ' + p.unit;
        $('[data-rack]').textContent = fmtPeso(r.rate);
        $('[data-disc]').textContent = '−' + fmtPeso(off);
        $('[data-total]').textContent = fmtPeso(total);
        $('[data-pay]').textContent = 'Pay ' + fmtPeso(total);
        $('[data-pay]').href = 'book-done.html?p=' + p.id + '&room=' + i;
      };
      $('[data-rooms]').addEventListener('change', renderTrip);
      $$('[data-step]').forEach(function (b) {
        b.addEventListener('click', function () {
          guests = Math.min(6, Math.max(1, guests + Number(b.dataset.step)));
          $('[data-guests]').textContent = guests;
        });
      });
      renderTrip();
      return;
    }

    // ---- Stays: a date range from a calendar, adults and children, the Prestige free night, requests. ----
    $$('[data-stay-form], [data-times], [data-perk], [data-free-row], [data-cancel], [data-req], [data-bar-sum]').forEach(function (e) { e.hidden = false; });
    $('.c-req-bar').classList.add('is-stay');

    // Dates and guests come from the sheets this page shares with the listing (stay.js). Without dates from the
    // listing, the sample stay is the next weekend.
    var f = SLStay.fmt, today = SLStay.today;
    var firstIn = f.parse(queryParam('in')) || new Date(2026, 9, 23);
    var s = SLStay({
      checkIn: firstIn, checkOut: f.parse(queryParam('out')) || f.add(firstIn, 2),
      adults: Number(queryParam('a')) || 2, kids: Number(queryParam('c')) || 0,
      maxParty: Math.max.apply(null, sleeps), onChange: render
    }).state;

    function render() {
      // Rooms too small for the party grey out; if the picked one no longer fits, the first that does is picked.
      var n = s.adults + s.kids;
      $$('.c-bkroom').forEach(function (row, i) {
        var input = row.querySelector('input');
        input.disabled = sleeps[i] < n;
        row.classList.toggle('is-full', input.disabled);
      });
      if (document.querySelector('input[name="room"]:checked').disabled) {
        var fit = $$('input[name="room"]').filter(function (x) { return !x.disabled; })[0];
        if (fit) fit.checked = true;
      }

      var i = room(), r = p.rooms[i], nights = f.nights(s.checkIn, s.checkOut);
      var rack = r.rate * nights, off = Math.round(r.rate * p.discount / 100) * nights;
      var free = $('[data-free]').checked ? member(r.rate) : 0;
      var total = rack - off - free;
      var deadline = f.add(s.checkIn, -2);

      $('[data-range]').textContent = f.range(s.checkIn, s.checkOut);
      $('[data-nights]').textContent = f.plural(nights, 'night', 'nights');
      $('[data-party]').textContent = f.party(s.adults, s.kids);
      $('[data-line]').textContent = fmtPeso(r.rate) + ' × ' + f.plural(nights, 'night', 'nights');
      $('[data-rack]').textContent = fmtPeso(rack);
      $('[data-disc]').textContent = '−' + fmtPeso(off);
      $('[data-free-row]').hidden = !free;
      $('[data-free-amt]').textContent = '−' + fmtPeso(free);
      $('[data-total]').textContent = fmtPeso(total);
      $('[data-cancel]').textContent = deadline >= today
        ? 'Free cancellation until ' + f.day(deadline) + '.'
        : 'Check-in is under 2 days away, so this stay can’t be cancelled for free.';
      $('[data-bar-total]').textContent = fmtPeso(total);
      $('[data-bar-nights]').textContent = 'Total for ' + f.plural(nights, 'night', 'nights');
      $('[data-pay]').textContent = total > 0 ? 'Pay' : 'Confirm';
      $('[data-pay]').href = 'book-done.html?p=' + p.id + '&room=' + i + '&in=' + f.iso(s.checkIn) + '&out=' + f.iso(s.checkOut) +
        '&a=' + s.adults + '&c=' + s.kids + '&free=' + (free ? 1 : 0) +
        ($('[data-reqtext]').value.trim() ? '&req=' + encodeURIComponent($('[data-reqtext]').value.trim()) : '');
    }

    $('[data-rooms]').addEventListener('change', render);
    $('[data-free]').addEventListener('change', render);
    $('[data-reqtext]').addEventListener('input', render);

    render();
  })();
</script>
</body>
</html>
