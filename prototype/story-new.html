<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFFFFF">
  <title>Subic.Life - New story</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/light/style.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css" rel="stylesheet">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="components.css">
  <link rel="stylesheet" href="screen.css">
  <link rel="stylesheet" href="components-a.css">
  <link rel="stylesheet" href="shell.css">
  <link rel="stylesheet" href="theme.css">
  <script src="shell.js"></script>
</head>
<body>
<div class="phone is-pushed c-flat">

  <header class="c-statusbar">
    <span>9:41</span>
    <span class="c-statusbar__icons">
      <span class="material-symbols-outlined">signal_cellular_alt</span>
      <span class="material-symbols-outlined">wifi</span>
      <span class="material-symbols-outlined">battery_full</span>
    </span>
  </header>

  <nav class="c-navbar">
    <a data-back class="c-navbar__cancel" href="explore.html">Cancel</a>
    <h1 class="c-navbar__title">New story</h1>
    <button class="c-navbar__share" type="button" data-share disabled>Share</button>
  </nav>

  <main class="screen-scroll c-compose">
    <div class="c-cvisit">
      <span class="c-cvisit__thumb"><img data-thumb src="img/thumb-meat-plus.jpg" alt=""></span>
      <span class="c-cvisit__text">
        <span class="c-cvisit__name" data-name></span>
        <span class="c-verified"><span class="material-symbols-outlined" aria-hidden="true">verified</span><span data-when></span></span>
      </span>
    </div>

    <label class="c-cphoto" for="photo-file" data-preview>
      <span class="c-cphoto__empty">
        <i class="ph-light ph-camera" aria-hidden="true"></i>
        Add a photo
      </span>
    </label>
    <input id="photo-file" type="file" accept="image/*" hidden>
    <div class="c-croll" data-roll aria-label="Recent photos"></div>

    <div class="c-ctip">
      <label class="c-ctip__label u-sr-only" for="tip">Your tip</label>
      <div class="c-ctip__box">
        <textarea class="c-ctip__field" id="tip" rows="3" maxlength="150" placeholder="What should members know? A dish, a time, a table."></textarea>
        <span class="c-ctip__count" data-count>0/150</span>
      </div>
      <p class="c-cnote" data-note></p>
    </div>
  </main>

  <span class="c-homeindicator"></span>

</div>
<script src="data-a.js"></script>
<script src="data-e.js"></script>
<script>
(function () {
  var p = placeFor(queryParam('p') || 'meatplus');
  var when = queryParam('v') || 'Today';
  var from = queryParam('from') || 'explore.html';
  var $ = function (s) { return document.querySelector(s); };
  function esc(t) {
    return String(t).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  // The visit is fixed: a story can only come from a place you paid at with the card.
  $('.c-navbar__cancel').href = from;
  $('[data-thumb]').src = p.thumb;
  $('[data-name]').textContent = p.name;
  $('[data-when]').textContent = 'Verified visit · ' + when;
  $('[data-note]').textContent = 'Members see it on ' + p.name + ' and in Discover, with your name and photo.';

  // A stand-in for the camera roll: this place's photos first. The camera tile opens the real picker.
  var roll = (p.photos || [p.hero]).concat(['img/pass-subic-bay.jpg', 'img/hist-lighthouse-sep.jpg', 'img/card-camayan.jpg'])
    .filter(function (src, i, all) { return all.indexOf(src) === i; }).slice(0, 7);
  var rollEl = $('[data-roll]');
  rollEl.innerHTML = '<label class="c-croll__item c-croll__cam" for="photo-file" aria-label="Take or choose a photo"><i class="ph-light ph-camera" aria-hidden="true"></i></label>' +
    roll.map(function (src, i) {
      return '<button class="c-croll__item" type="button" data-src="' + src + '" aria-pressed="false" aria-label="Recent photo ' + (i + 1) + '">' +
        '<img src="' + src + '" alt=""><span class="c-croll__check"><i class="ph ph-check" aria-hidden="true"></i></span></button>';
    }).join('');

  var photo = null;
  var preview = $('[data-preview]'), share = $('[data-share]');
  function pick(src, btn) {
    photo = src;
    preview.innerHTML = '<img src="' + src + '" alt="Your photo">';
    rollEl.querySelectorAll('[data-src]').forEach(function (b) {
      b.classList.toggle('is-on', b === btn);
      b.setAttribute('aria-pressed', b === btn ? 'true' : 'false');
    });
    share.disabled = false;
  }
  rollEl.addEventListener('click', function (e) {
    var b = e.target.closest('[data-src]');
    if (b) pick(b.getAttribute('data-src'), b);
  });

  // A real photo from the phone, scaled to 1080 px so it fits in local storage.
  $('#photo-file').addEventListener('change', function () {
    var f = this.files && this.files[0];
    if (!f) return;
    var img = new Image();
    img.onload = function () {
      var k = Math.min(1, 1080 / Math.max(img.width, img.height));
      var c = document.createElement('canvas');
      c.width = Math.round(img.width * k);
      c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(img.src);
      pick(c.toDataURL('image/jpeg', 0.82), null);
    };
    img.src = URL.createObjectURL(f);
  });

  var tip = $('#tip'), count = $('[data-count]');
  tip.addEventListener('input', function () { count.textContent = tip.value.length + '/150'; });

  // Share: save it and go back where you came from, like Instagram (no success screen).
  // Discover then opens on Stories, with yours first and a short "Story shared" note.
  share.addEventListener('click', function () {
    if (!photo) return;
    var s = { id: 'mine-' + Date.now(), at: Date.now(), place: p.id, visited: when, photos: [photo], caption: tip.value.trim() };
    if (saveStory(s)) { try { sessionStorage.setItem('sl-shared', '1'); } catch (e) {} }
    window.subicNav(from, 'back');
  });
})();
</script>
</body>
</html>
