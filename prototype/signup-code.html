<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Subic.Life - Enter the code</title><link rel="icon" href="img/icon.svg" type="image/svg+xml"><link rel="icon" href="img/favicon-32.png" sizes="32x32"><link rel="apple-touch-icon" href="img/apple-touch-icon.png"><link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/light/style.css" rel="stylesheet">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="components.css">
  <link rel="stylesheet" href="components-c.css">
  <link rel="stylesheet" href="screen.css">
  <link rel="stylesheet" href="shell.css">
  <link rel="stylesheet" href="theme.css">
  <script src="shell.js"></script>
</head>
<body>
<div class="phone c-discover c-auth c-auth--white">

  <header class="c-statusbar">
    <span>9:41</span>
    <span class="c-statusbar__icons">
      <span class="material-symbols-outlined">signal_cellular_alt</span>
      <span class="material-symbols-outlined">wifi</span>
      <span class="material-symbols-outlined">battery_full</span>
    </span>
  </header>

  <div class="c-dhead c-dhead--push">
    <a class="c-dhead__back" data-back href="signup.html" aria-label="Back to mobile number"><i class="ph-light ph-caret-left" aria-hidden="true"></i></a>
    <img class="c-auth__inklogo" src="img/logo-ink.svg" alt="Subic.Life">
    <span class="c-dhead__spacer" aria-hidden="true"></span>
  </div>

  <div class="c-auth__head">
    <h1 class="c-auth__title">Enter the 6-digit code</h1>
    <p class="c-auth__sub">We texted it to +63 917-123-4567. <a class="c-auth__edit" href="signup.html">Change number</a></p>
  </div>

  <section class="c-auth__sheet">
    <label class="c-auth__otp">
      <input class="c-auth__codein" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" value="482" aria-label="6-digit code">
      <span class="c-auth__cell" data-cell aria-hidden="true"></span><span class="c-auth__cell" data-cell aria-hidden="true"></span><span class="c-auth__cell" data-cell aria-hidden="true"></span><span class="c-auth__cell" data-cell aria-hidden="true"></span><span class="c-auth__cell" data-cell aria-hidden="true"></span><span class="c-auth__cell" data-cell aria-hidden="true"></span>
    </label>
    <p class="c-auth__resend">Didn't get it? You can resend in 0:30</p>
    <div class="c-auth__cta">
      <a class="c-auth__send" href="signup-details.html">Continue</a>
    </div>
  </section>

  <span class="c-homeindicator"></span>

</div>
<script src="app.js"></script>
<script>
(function () { // the one code field fills the six lines; the next empty line is marked
  var input = document.querySelector('.c-auth__codein'), cells = document.querySelectorAll('[data-cell]');
  if (!input) return;
  function render() {
    input.value = input.value.replace(/\D/g, '').slice(0, 6);
    var focused = document.activeElement === input;
    for (var i = 0; i < cells.length; i++) {
      cells[i].textContent = input.value.charAt(i);
      cells[i].classList.toggle('is-active', i === input.value.length || (!focused && i === input.value.length));
    }
  }
  input.addEventListener('input', render);
  render();
})();
</script>
<script src="img/real/manifest.js"></script>
<script src="real-photos.js"></script>
</body>
</html>
