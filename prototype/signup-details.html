<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Subic.Life - Sign up</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/light/style.css" rel="stylesheet">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="components.css">
  <link rel="stylesheet" href="components-c.css">
  <link rel="stylesheet" href="screen.css">
  <link rel="stylesheet" href="shell.css">
  <link rel="stylesheet" href="theme.css">
  <script src="shell.js"></script>
</head>
<body>
<div class="phone c-discover c-auth c-auth--white c-auth--form">

  <header class="c-statusbar">
    <span>9:41</span>
    <span class="c-statusbar__icons">
      <span class="material-symbols-outlined">signal_cellular_alt</span>
      <span class="material-symbols-outlined">wifi</span>
      <span class="material-symbols-outlined">battery_full</span>
    </span>
  </header>

  <div class="c-dhead c-dhead--push">
    <a class="c-dhead__back" data-back href="signup-code.html" aria-label="Back to code"><i class="ph-light ph-caret-left" aria-hidden="true"></i></a>
    <img class="c-auth__inklogo" src="img/logo-ink.svg" alt="Subic.Life">
    <span class="c-dhead__spacer" aria-hidden="true"></span>
  </div>

  <main class="screen-scroll">

    <div class="c-auth__head">
      <h1 class="c-auth__title">What name goes on your card?</h1>
      <p class="c-auth__sub">Use the name on your ID. Partner staff check it when you show your card.</p>
    </div>

    <section class="u-gutter u-mt-16 c-namegrid">
      <div class="c-namegrid__cell">
        <h2 class="c-section-title is-caption" id="given-name-label">First name</h2>
        <label class="c-field">
          <input class="c-field__input" type="text" autocomplete="given-name" placeholder="Ana" aria-labelledby="given-name-label">
        </label>
      </div>
      <div class="c-namegrid__cell">
        <h2 class="c-section-title is-caption" id="middle-name-label">Middle name <span class="c-optional">Optional</span></h2>
        <label class="c-field">
          <input class="c-field__input" type="text" autocomplete="additional-name" placeholder="Cruz" aria-labelledby="middle-name-label">
        </label>
      </div>
      <div class="c-namegrid__cell is-wide">
        <h2 class="c-section-title is-caption" id="family-name-label">Last name</h2>
        <label class="c-field">
          <input class="c-field__input" type="text" autocomplete="family-name" placeholder="Reyes" aria-labelledby="family-name-label">
        </label>
      </div>
      <div class="c-namegrid__cell is-wide">
        <h2 class="c-section-title is-caption" id="email-label">Email <span class="c-optional">Optional</span></h2>
        <label class="c-field">
          <input class="c-field__input" type="email" inputmode="email" autocomplete="email" placeholder="ana.reyes@gmail.com" aria-labelledby="email-label">
        </label>
      </div>
    </section>
    <p class="u-gutter c-group__sub">We'll send receipts and renewal reminders here.</p>

    <div class="c-auth__cta">
      <a class="c-auth__send" href="signup-selfie.html">Continue</a>
    </div>

  </main>

  <span class="c-homeindicator"></span>

</div>
<script src="app.js"></script>
<script src="img/real/manifest.js"></script>
<script src="real-photos.js"></script>
</body>
</html>
