<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Subic.Life - Sign up</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="components.css">
  <link rel="stylesheet" href="components-c.css">
  <link rel="stylesheet" href="screen.css">
  <link rel="stylesheet" href="shell.css">
  <link rel="stylesheet" href="theme.css">
  <script src="shell.js"></script>
</head>
<body>
<div class="phone theme-night is-onboard c-push">

  <header class="c-statusbar">
    <span>9:41</span>
    <span class="c-statusbar__icons">
      <span class="material-symbols-outlined">signal_cellular_alt</span>
      <span class="material-symbols-outlined">wifi</span>
      <span class="material-symbols-outlined">battery_full</span>
    </span>
  </header>

  <nav class="c-navbar">
    <a data-back class="c-navbar__back" href="signup-code.html" aria-label="Back to code">
      <svg class="c-navbar__chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="M15.75 19.5L8.25 12l7.5-7.5"/></svg>
    </a>
    <h1 class="c-navbar__title">Sign up</h1>
    <span></span>
  </nav>

  <main class="screen-scroll">

    <section class="u-gutter u-mt-8">
      <h2 class="c-section-title is-title">Name on your card</h2>
    </section>

    <section class="u-gutter u-mt-16 c-namegrid">
      <div class="c-namegrid__cell">
        <h2 class="c-section-title is-caption" id="given-name-label">First name</h2>
        <label class="c-field">
          <input class="c-field__input" type="text" autocomplete="given-name" placeholder="Ana" aria-labelledby="given-name-label">
        </label>
      </div>
      <div class="c-namegrid__cell">
        <h2 class="c-section-title is-caption" id="middle-name-label">Middle name <span class="c-optional">Optional</span></h2>
        <label class="c-field">
          <input class="c-field__input" type="text" autocomplete="additional-name" placeholder="Cruz" aria-labelledby="middle-name-label">
        </label>
      </div>
      <div class="c-namegrid__cell is-wide">
        <h2 class="c-section-title is-caption" id="family-name-label">Last name</h2>
        <label class="c-field">
          <input class="c-field__input" type="text" autocomplete="family-name" placeholder="Reyes" aria-labelledby="family-name-label">
        </label>
      </div>
      <div class="c-namegrid__cell is-wide">
        <h2 class="c-section-title is-caption" id="email-label">Email <span class="c-optional">Optional</span></h2>
        <label class="c-field">
          <input class="c-field__input" type="email" inputmode="email" autocomplete="email" placeholder="ana.reyes@gmail.com" aria-labelledby="email-label">
        </label>
      </div>
    </section>
    <p class="u-gutter c-group__sub">Email gets you receipts and renewal reminders.</p>

    <section class="u-gutter u-mt-32">
      <a class="c-btn primary" href="signup-selfie.html">Continue</a>
    </section>

  </main>

  <span class="c-homeindicator"></span>

</div>
<script src="app.js"></script>
<script src="img/real/manifest.js"></script>
<script src="real-photos.js"></script>
</body>
</html>
