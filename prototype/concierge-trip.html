<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFFFFF">
  <title>Subic.Life - Your trip</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/light/style.css" rel="stylesheet">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="components.css">
  <link rel="stylesheet" href="components-c.css">
  <link rel="stylesheet" href="components-g.css">
  <link rel="stylesheet" href="screen.css">
  <link rel="stylesheet" href="shell.css">
  <link rel="stylesheet" href="theme.css">
  <script src="shell.js"></script>
</head>
<body>
<div class="phone c-push c-discover c-cgpage">

  <header class="c-statusbar">
    <span>9:41</span>
    <span class="c-statusbar__icons">
      <span class="material-symbols-outlined">signal_cellular_alt</span>
      <span class="material-symbols-outlined">wifi</span>
      <span class="material-symbols-outlined">battery_full</span>
    </span>
  </header>

  <div class="c-dhead c-dhead--push">
    <a class="c-dhead__back" href="concierge.html" data-back aria-label="Back to Concierge"><i class="ph-light ph-caret-left" aria-hidden="true"></i></a>
    <h1 class="c-dhead__title" id="title">Your trip</h1>
    <span class="c-dhead__spacer" aria-hidden="true"></span>
  </div>

  <main class="screen-scroll">
    <p class="c-cgdates" id="dates">Sat 17 – Sun 18 Oct · Subic Bay</p>

    <div id="days"></div>

    <a class="c-cgcal" id="cal" href="concierge-trip.html"><i class="ph-light ph-calendar-plus" aria-hidden="true"></i>Add to calendar</a>
  </main>

  <span class="c-homeindicator"></span>

</div>
<script src="data-g.js"></script>
<script src="img/real/manifest.js"></script>
<script src="real-photos.js"></script>
<script>
(function () {
  var C = window.CONCIERGE;
  var trip = C.TRIP;

  document.title = 'Subic.Life - ' + trip.title;
  document.getElementById('title').textContent = trip.title;
  document.getElementById('dates').textContent = trip.dates + ' · Subic Bay';

  var box = document.getElementById('days');
  // Same lists as the Concierge tab: one hairline list per day, words only for a stop Mika is still arranging.
  trip.days.forEach(function (d) {
    var day = document.createElement('section');
    day.className = 'c-cgday';
    day.innerHTML = '<h2 class="c-mehead">' + d.label + '</h2>';
    var list = document.createElement('div');
    list.className = 'c-melist';
    d.items.forEach(function (i) {
      var r = document.createElement('a');
      r.className = 'c-merow c-cgstop';
      r.href = i.href;
      r.innerHTML =
        '<span class="c-cgstop__clock"><span class="c-cgstop__hm">' + i.time.split(' ')[0] + '</span>' +
        '<span class="c-cgstop__ampm">' + (i.time.split(' ')[1] || '') + '</span></span>' +
        '<span class="c-merow__main">' +
        '<span class="c-cgstop__name">' + i.title + '</span>' +
        '<span class="c-merow__sub">' + i.sub + (i.status === 'confirmed' ? '<span class="u-sr"> · Confirmed</span>' : '') + '</span>' +
        (i.status === 'progress' ? '<span class="c-cgstop__status">Mika is on it</span>' : '') +
        '</span>' +
        (i.photo === false ? '' : '<img class="c-cgstop__thumb" alt="" src="' + i.img + '">');
      list.appendChild(r);
    });
    day.appendChild(list);
    box.appendChild(day);
  });

  // Add to calendar: one event per stop, as an .ics file the browser downloads.
  var lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Subic.Life//Trip//EN'];
  trip.days.forEach(function (day) {
    day.items.forEach(function (i) {
      lines.push('BEGIN:VEVENT',
        'UID:' + i.ics[0] + '-' + i.title.length + '@subic.life',
        'DTSTAMP:20261012T000000Z',
        'DTSTART:' + i.ics[0],
        'DTEND:' + i.ics[1],
        'SUMMARY:' + i.title.replace(/,/g, '\\,'),
        'LOCATION:Subic Bay\\, Philippines',
        'END:VEVENT');
    });
  });
  lines.push('END:VCALENDAR');

  var cal = document.getElementById('cal');
  cal.href = 'data:text/calendar;charset=utf-8,' + encodeURIComponent(lines.join('\r\n'));
  cal.setAttribute('download', 'subic-life-trip.ics');
  cal.target = '_blank';
})();
</script>
</body>
</html>
