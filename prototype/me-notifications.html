<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Subic.Life - Notifications</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="components.css">
  <link rel="stylesheet" href="components-c.css">
  <link rel="stylesheet" href="screen.css">
  <link rel="stylesheet" href="shell.css">
  <link rel="stylesheet" href="theme.css">
  <script src="shell.js"></script>
</head>
<body>
<div class="phone c-push c-grouped">

  <header class="c-statusbar">
    <span>9:41</span>
    <span class="c-statusbar__icons">
      <span class="material-symbols-outlined">signal_cellular_alt</span>
      <span class="material-symbols-outlined">wifi</span>
      <span class="material-symbols-outlined">battery_full</span>
    </span>
  </header>

  <nav class="c-navbar">
    <a data-back class="c-navbar__back" href="me.html" aria-label="Back to Me">
      <svg class="c-navbar__chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="M15.75 19.5L8.25 12l7.5-7.5"/></svg>
    </a>
    <h1 class="c-navbar__title">Notifications</h1>
    <span></span>
  </nav>

  <main class="screen-scroll">

    <div class="c-group u-mt-16">
      <label class="c-group__row">
        <span class="c-group__main">Offers near me</span>
        <input class="c-switch" type="checkbox" checked>
      </label>
      <label class="c-group__row">
        <span class="c-group__main">Booking updates</span>
        <input class="c-switch" type="checkbox" checked>
      </label>
      <label class="c-group__row">
        <span class="c-group__main">Payment receipts</span>
        <input class="c-switch" type="checkbox" checked>
      </label>
      <label class="c-group__row">
        <span class="c-group__main">Concierge messages</span>
        <input class="c-switch" type="checkbox">
      </label>
    </div>

  </main>

  <span class="c-homeindicator"></span>

</div>
<script src="app.js"></script>
</body>
</html>
