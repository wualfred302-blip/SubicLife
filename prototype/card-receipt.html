<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Subic.Life - Payment Receipt</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="components.css">
  <link rel="stylesheet" href="screen.css">
  <link rel="stylesheet" href="shell.css">
  <link rel="stylesheet" href="theme.css">
  <script src="shell.js"></script>
</head>
<body>
<div class="phone c-push c-discover c-cgpage c-bkpage c-rcpage">

  <header class="c-statusbar">
    <span>9:41</span>
    <span class="c-statusbar__icons">
      <span class="material-symbols-outlined">signal_cellular_alt</span>
      <span class="material-symbols-outlined">wifi</span>
      <span class="material-symbols-outlined">battery_full</span>
    </span>
  </header>

  <div class="c-dhead c-dhead--push">
    <span class="c-dhead__spacer c-bkdone__gap" aria-hidden="true"></span>
    <h1 class="c-dhead__title">Receipt</h1>
    <a class="c-bkdone__done" data-back href="me-payments.html">Done</a>
  </div>

  <main class="screen-scroll">

    <div class="c-rchead">
      <img class="c-rchead__img" src="img/thumb-meat-plus.jpg" alt="">
      <h2 class="c-rchead__title">You saved ₱480</h2>
      <p class="c-rchead__sub">Meat Plus Cafe · Today, 7:42 PM</p>
    </div>

    <div class="c-melist c-bkprice c-rcprice">
      <div class="c-bkprice__row"><span>Bill</span><span>₱2,400</span></div>
      <div class="c-bkprice__row is-save"><span>Prestige discount (20%)</span><span>−₱480</span></div>
      <div class="c-bkprice__row is-total"><span>You paid</span><span>₱1,920</span></div>
    </div>

    <p class="c-rcnote">Saved this year: ₱12,450</p>

  </main>

  <span class="c-homeindicator"></span>

</div>
<script src="app.js"></script>
<script src="img/real/manifest.js"></script>
<script src="real-photos.js"></script>
</body>
</html>
